            /* ==================== DEEN GUIDE CHAT LAYOUT FIX ====================
      Locks the Deen Guide into a ChatGPT-style layout:
      - Fixed header (outside the scroll area)
      - ONE scrollable chat thread
      - Fixed input bar at the bottom
      Message bubbles never shrink, so answers are never clipped or
      overlapped, and the chat never scrolls underneath the composer.
    ==================================================================== */
    .main:has(#guide-thread) {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
    }
    .content:has(#guide-thread) {
      display: flex;
      flex-direction: column;
      flex: 1 1 0;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      padding-bottom: 0;
      overscroll-behavior: none;
    }
    @media (max-width: 880px) {
      .main:has(#guide-thread) {
        height: calc(100dvh - 60px - 80px - env(safe-area-inset-bottom));
        max-height: calc(100dvh - 60px - 80px - env(safe-area-inset-bottom));
      }
      .content:has(#guide-thread) {
        height: 100%;
        max-height: 100%;
      }
    }

    /* The single scrollable area for the Deen Guide chat. */
    #guide-thread {
      flex: 1 1 0;
      min-height: 0 !important;
      max-height: none !important;
      height: auto;
      margin-bottom: 0 !important;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      /* Room so the last bubble is never hidden behind the composer. */
      padding-bottom: 24px !important;
      scroll-padding-bottom: 24px !important;
    }

    /* CRITICAL FIX: every message bubble (user, assistant, empty state,
      thinking indicator) is a direct flex child of #guide-thread. With the
      default flex-shrink:1 and overflow-x:hidden, flexbox compresses each
      bubble instead of letting the thread scroll — which clips and overlaps
      the answers. flex-shrink:0 keeps each bubble at its natural height. */
    #guide-thread > * {
      flex-shrink: 0 !important;
    }

    /* The composer (input + Send) sits OUTSIDE the scroll area, at the
      bottom of the flex column. flex:0 0 auto keeps it from being squished
      and the padding leaves room so nothing scrolls underneath it. */
    div:has(> #guide-input) {
      flex: 0 0 auto !important;
      padding-bottom: 20px !important;
      background: var(--bg);
    }

      <script>
        /* ============================= THEME INIT (runs immediately, before paint) ============================= */
        let _globalAdhanPlayer = null;
        (function initTheme() {
          const now = new Date();
          const hour = now.getHours();
          const autoTheme = (hour >= 6 && hour < 18) ? 'light' : 'dark';

          let savedTheme = null;
          let savedDate = null;
          try {
            savedTheme = localStorage.getItem('theme');
            savedDate = localStorage.getItem('theme-date');
          } catch (e) { }

          const today = dateStr(now);

          let theme;
          if (savedTheme && savedDate === today) {
            theme = savedTheme;
          } else {
            theme = autoTheme;
            try {
              localStorage.removeItem('theme');
              localStorage.removeItem('theme-date');
            } catch (e) { }
          }

          document.documentElement.setAttribute('data-theme', theme);
          window.__autoTheme = autoTheme;
          window.__themeDate = today;
        })();

        /* ============================= UTIL ============================= */
        const $ = (s, el = document) => el.querySelector(s);
        const $$ = (s, el = document) => [...el.querySelectorAll(s)];
        const dsin = d => Math.sin(d * Math.PI / 180), dcos = d => Math.cos(d * Math.PI / 180), dtan = d => Math.tan(d * Math.PI / 180);
        const darcsin = x => Math.asin(Math.max(-1, Math.min(1, x))) * 180 / Math.PI;
        const darccos = x => Math.acos(Math.max(-1, Math.min(1, x))) * 180 / Math.PI;
        const darctan = x => Math.atan(x) * 180 / Math.PI;
        const darctan2 = (y, x) => Math.atan2(y, x) * 180 / Math.PI;
        const fixAngle = a => { a = a % 360; return a < 0 ? a + 360 : a; };
        function pad(n) { return String(n).padStart(2, '0'); }
        function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
      function fmtTime(d) { if (!d) return '--:--'; const c = new Date(d.getTime()); c.setSeconds(0, 0); c.setMinutes(c.getMinutes() + (d.getSeconds() >= 30 ? 1 : 0)); let h = c.getHours(), m = c.getMinutes(); let ap = h >= 12 ? 'PM' : 'AM'; let h12 = h % 12; if (h12 === 0) h12 = 12; return h12 + ':' + pad(m) + ' ' + ap; }
             function fmtDur(ms) { 
          if (ms < 0) ms = 0; 
          // FIX: Use Math.ceil to round up partial seconds to the next whole second
          let s = Math.ceil(ms / 1000); 
          let h = Math.floor(s / 3600); 
          s -= h * 3600; 
          let m = Math.floor(s / 60); 
          s -= m * 60; 
          return pad(h) + ':' + pad(m) + ':' + pad(s); 
        }
       function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(window.__tt); window.__tt = setTimeout(() => t.classList.remove('show'), 2200); }

// Show the GPS confirmation toast ONCE PER APP SESSION (refresh resets it).

function toastGpsOnce(msg) {

        /* ============================= PRAYER CALCULATION ============================= */
        const CALC_METHODS = {
          MWL: { label: 'Muslim World League', fajr: 18, ishaAngle: 17 },
          ISNA: { label: 'Islamic Society of North America', fajr: 15, ishaAngle: 15 },
          EGYPT: { label: 'Egyptian General Authority', fajr: 19.5, ishaAngle: 17.5 },
          KARACHI: { label: 'University of Islamic Sciences, Karachi', fajr: 18, ishaAngle: 18 },
          UMMALQURA: { label: 'Umm al-Qura University, Makkah', fajr: 18.5, ishaMinutes: 90 },
        };
        function julianDay(y, m, d) {
          if (m <= 2) { y -= 1; m += 12; }
          const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
          return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
        }
        function sunPosition(jd) {
          const D = jd - 2451545.0;
          const g = fixAngle(357.529 + 0.98560028 * D);
          const q = fixAngle(280.459 + 0.98564736 * D);
          const L = fixAngle(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g));
          const e = 23.439 - 0.00000036 * D;
          let RA = darctan2(dcos(e) * dsin(L), dcos(L)) / 15; RA = (RA % 24 + 24) % 24;
          const qh = (q / 15 % 24 + 24) % 24;
          let eqt = qh - RA; if (eqt > 12) eqt -= 24; if (eqt < -12) eqt += 24;
          const decl = darcsin(dsin(e) * dsin(L));
          return { decl, eqt };
        }
        function hourAngle(angleDeg, lat, decl) {
          const num = -dsin(angleDeg) - dsin(lat) * dsin(decl);
          const den = dcos(lat) * dcos(decl);
          return darccos(num / den) / 15;
        }
        function hoursToDate(baseDate, hoursLocal) {
          const d = new Date(baseDate); d.setHours(0, 0, 0, 0);
          return new Date(d.getTime() + hoursLocal * 3600000);
        }
              function computePrayerTimesFor(date, lat, lng, tz, methodKey, asrMethod) {
          const method = CALC_METHODS[methodKey] || CALC_METHODS.MWL;
          const jd = julianDay(date.getFullYear(), date.getMonth() + 1, date.getDate());
          const { decl, eqt } = sunPosition(jd + 0.5 - lng / 360);
          const dhuhrHours = 12 - eqt - lng / 15 + tz;
          
          const fajrHours = dhuhrHours - hourAngle(method.fajr, lat, decl);
          const sunriseHours = dhuhrHours - hourAngle(0.833, lat, decl);
          const sunsetHours = dhuhrHours + hourAngle(0.833, lat, decl);
          
          const t = asrMethod === 'hanafi' ? 2 : 1;
          const asrAlt = darctan(1 / (t + dtan(Math.abs(lat - decl))));
          const asrHours = dhuhrHours + hourAngle(-asrAlt, lat, decl);
          
          const maghribHours = sunsetHours;
          let ishaHours;
          if (method.ishaMinutes) { 
            ishaHours = maghribHours + method.ishaMinutes / 60; 
          } else { 
            ishaHours = dhuhrHours + hourAngle(method.ishaAngle, lat, decl); 
          }

          // =========================================================
          // THE PERFECT TIME FORMATTING FOR ALL COUNTRIES
          // =========================================================
          // This drops the seconds for ALL prayers. 
          // So 4:49:45 becomes 4:49 (Today).
          // And 4:50:15 becomes 4:50 (Tomorrow).
          // It uses the local timezone (tz) so it works perfectly everywhere.
          
                                        const formatTime = (baseDate, hoursLocal) => {
            const d = new Date(baseDate); 
            d.setHours(0, 0, 0, 0);
            // Calculate the time based on the exact location's timezone
            const timeObj = new Date(d.getTime() + hoursLocal * 3600000);
            
            // Round to the nearest minute. This is the standard for exact prayer times.
            // If the seconds are 30 or more, add 1 minute.
            if (timeObj.getSeconds() >= 30) {
              timeObj.setMinutes(timeObj.getMinutes() + 1);
            }
            timeObj.setSeconds(0, 0);
            
            return timeObj;
          };

                                  return {
            fajr: formatTime(date, fajrHours), 
            sunrise: formatTime(date, sunriseHours),
            dhuhr: formatTime(date, dhuhrHours), 
            asr: formatTime(date, asrHours),
            maghrib: formatTime(date, maghribHours), 
            isha: formatTime(date, ishaHours),
          };
        }
      

 function getPrayerTimezone() {
  const location = S.settings?.location;

  // Prefer the timezone saved for the selected location.
  if (location?.timezone) {
    try {
      new Intl.DateTimeFormat("en-US", {
        timeZone: location.timezone
      });
      return location.timezone;
    } catch (error) {
      console.warn("Invalid saved prayer timezone:", location.timezone);
    }
  }

  // Fallback to the device timezone ONLY if no city timezone is found
  return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
}

function localTzOffset(date = new Date()) {
  const timezone = getPrayerTimezone();

  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: timezone,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(date);

  const values = {};
  for (const part of parts) {
    if (part.type !== "literal") {
      values[part.type] = Number(part.value);
    }
  }

  const localAsUTC = Date.UTC(
    values.year,
    values.month - 1,
    values.day,
    values.hour,
    values.minute,
    values.second
  );

  return (localAsUTC - Math.floor(date.getTime() / 1000) * 1000) / 3600000;
}

function todaysTimes() {
  const settings = S.settings;
  const now = new Date();
  const timezone = getPrayerTimezone();

  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: timezone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(now);

  const values = {};
  for (const part of parts) {
    if (part.type !== 'literal') values[part.type] = part.value;
  }

  const locationDate = new Date(
    Number(values.year),
    Number(values.month) - 1,
    Number(values.day),
    12, 0, 0, 0
  );

  return computePrayerTimesFor(
    locationDate,
    settings.location.lat,
    settings.location.lng,
    localTzOffset(locationDate),
    settings.calcMethod,
    settings.asrMethod
  );
}

function timesForDate(date) {
  const s = S.settings;
  return computePrayerTimesFor(
    date,
    s.location.lat,
    s.location.lng,
    localTzOffset(date),
    s.calcMethod,
    s.asrMethod
  );
}

// ============================================================
// SYNC PRAYER TIMES TO THE SERVICE WORKER
// ============================================================
async function syncPrayerTimesToSW() {
  if (!('serviceWorker' in navigator)) return;
  if (!S || !S.settings || !S.settings.setupDone) return;

  try {
    const t = todaysTimes();
    const reg = await navigator.serviceWorker.ready;
    if (!reg.active) return;
    reg.active.postMessage({
      type: 'SW_SYNC_PRAYER_TIMES',
      times: {
        fajr:    t.fajr.toISOString(),
        dhuhr:   t.dhuhr.toISOString(),
        asr:     t.asr.toISOString(),
        maghrib: t.maghrib.toISOString(),
        isha:    t.isha.toISOString(),
      },
      notif: S.settings.notif,
      birthday: S.settings.birthday || null,
      locationLabel: S.settings.location?.label || '',
      date: dateStr(new Date()),
    });
  } catch (e) {
    console.warn('SW prayer-time sync failed:', e);
  }
}

              const vKey = String(entry.verse || '');
              const verseNum = parseInt(vKey.split(':')[1] || '0', 10) || 0;

                start: startMs / 1000,

              };

        function _estimateVerseFromTime(surahNum, currentTime, duration) {
          if (!duration || !isFinite(duration) || duration <= 0) return null;

          if (!meta) return null;
          const timings = _verseTimingsCache[surahNum];
          if (timings && timings.length) {
            for (let i = 0; i < timings.length; i++) {
              if (
                currentTime >= timings[i].start &&
                currentTime < timings[i].end
              ) {
                return timings[i].verse;
              }
            }
            let previousVerse = null;
            for (let i = 0; i < timings.length; i++) {
              if (currentTime >= timings[i].start) {
                previousVerse = timings[i].verse;
              } else {
                break;
              }
            }
            if (previousVerse !== null) {
              return previousVerse;
            }
            return timings[0].verse || 1;
          }

          { cat: "Evening", ar: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", meaning: "I seek refuge in the perfect words of Allah from the evil of what He has created. (recite three times)", source: "Sahih Muslim (Hadith 2708)" },
          { cat: "Evening", ar: "اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ", meaning: "O Allah, whatever blessing has come to me or to any of Your creation this evening is from You alone, without partner. So for You is all praise and to You is all thanks.", source: "Abu Dawud (Hadith 5073) — graded Hasan" },
          { cat: "Evening", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا فِيهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيهِ", meaning: "O Allah, I ask You for the good of this night and the good it contains, and I seek refuge in You from its evil and the evil it contains.", source: "Sahih Muslim" },
          { cat: "Evening", ar: "اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ", meaning: "O Allah, I have entered the evening and I call You to witness, and I call the bearers of Your Throne, Your angels and all Your creation to witness, that You are Allah, there is no god but You, alone without partner, and that Muhammad is Your servant and Messenger. (recite four times)", source: "Abu Dawud (Hadith 5069) — graded Sahih" },
          { cat: "Evening", ar: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", meaning: "In the name of Allah, with whose name nothing on earth or in the heavens can cause harm. He is the All-Hearing, the All-Knowing. (recite three times)", source: "Abu Dawud (Hadith 5088), at-Tirmidhi (Hadith 3388) — graded Sahih" },
          { cat: "Evening", ar: "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا", meaning: "I am pleased with Allah as Lord, Islam as religion, and Muhammad ﷺ as prophet. (recite three times)", source: "Abu Dawud (Hadith 5072), at-Tirmidhi (Hadith 3389) — graded Hasan" },
          { cat: "Evening", ar: "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ", meaning: "O Allah, grant my body health, O Allah, grant my hearing health, O Allah, grant my sight health. None has the right to be worshipped except You. (recite three times)", source: "Abu Dawud (Hadith 5090) — graded Hasan" },
          { cat: "Evening", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمُّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ", meaning: "O Allah! I seek refuge in You from disbelief and poverty. O Allah! I seek refuge in You from the punishment of the grave. There is no god but You. (recite three times)", source: "Abu Dawud (Hadith 5090) — graded Hasan" },
          { cat: "Evening", ar: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", meaning: "O Allah, You are my Lord, none has the right to be worshipped except You. You created me and I am Your servant... (Sayyid al-Istighfar — recite in morning and evening)", source: "Sahih al-Bukhari (Hadith 6306)" },
          { cat: "Evening", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", meaning: "Glory be to Allah, and praise be to Him. (recite one hundred times)", source: "Sahih Muslim (Hadith 2692)" },
          { cat: "Evening", ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", meaning: "There is no god but Allah alone, He has no partner. His is the dominion and His is the praise, and He is capable of all things. (recite ten times)", source: "Sahih al-Bukhari (Hadith 3293), Sahih Muslim (Hadith 2691)" },
          { cat: "Evening", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", meaning: "How perfect Allah is and I praise Him by the number of His creation and His pleasure, and by the weight of His throne, and the ink of His words. (recite three times)", source: "Sahih Muslim (Hadith 2726)" },
          { cat: "Evening", ar: "حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", meaning: "Allah is sufficient for me. There is no god but He, in Him I put my trust, and He is the Lord of the Mighty Throne. (recite seven times)", source: "Abu Dawud (Hadith 5081) — graded Sahih" },

          { cat: "After Salah", ar: "أَسْتَغْفِرُ اللَّهَ", meaning: "I ask Allah for forgiveness. (recited three times after each prayer)", source: "Sahih Muslim" },
          { cat: "After Salah", ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", meaning: "There is no god but Allah alone, He has no partner. His is the dominion and His is the praise, and He is capable of all things.", source: "Sahih al-Bukhari, Sahih Muslim" },
          { cat: "After Salah", ar: "سُبْحَانَ اللَّهِ", meaning: "Glory be to Allah. (recited 33 times, followed by Alhamdulillah 33 times and Allahu Akbar 34 times)", source: "Sahih Muslim" },
          { cat: "After Salah", ar: "اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", meaning: "O Allah, You are Peace and from You comes peace. Blessed are You, O Owner of majesty and honour.", source: "Sahih Muslim (Hadith 591)" },
          { cat: "After Salah", ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ", meaning: "There is no god but Allah alone, He has no partner. His is the dominion and His is the praise and He is capable of all things. O Allah, none can withhold what You give, and none can give what You withhold, and no wealth or majesty can benefit anyone, for from You is all wealth and majesty.", source: "Sahih al-Bukhari (Hadith 844), Sahih Muslim (Hadith 593)" },
          { cat: "After Salah", ar: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", meaning: "O Allah, help me to remember You, to give thanks to You, and to worship You in the best manner.", source: "Sunan Abi Dawud (Hadith 1522), an-Nasa'i (Hadith 1303) — graded Sahih" },
          { cat: "After Salah", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا وَعَذَابِ الْقَبْرِ", meaning: "O Allah, I seek refuge in You from miserliness, and I seek refuge in You from cowardice, and I seek refuge in You from being returned to the most decrepit age, and I seek refuge in You from the trials of this world and the punishment of the grave.", source: "Sahih al-Bukhari (Hadith 6374)" },
          { cat: "After Salah", ar: "آيَةُ الْكُرْسِيِّ", meaning: "Recite Ayat al-Kursi (Surah Al-Baqarah 2:255) after every prayer — whoever recites it after each prayer, nothing stands between him and Paradise except death.", source: "An-Nasa'i in As-Sunan Al-Kubra — graded Sahih" },
          { cat: "After Salah", ar: "قُلْ هُوَ اللَّهُ أَحَدٌ … قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ … قُلْ أَعُوذُ بِرَبِّ النَّاسِ", meaning: "Recite Al-Ikhlas, Al-Falaq, and An-Nas after every prayer.", source: "Sunan Abi Dawud (Hadith 1523), at-Tirmidhi (Hadith 3575) — graded Hasan" },

          { cat: "Before Sleeping", ar: "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", meaning: "In Your name, O Allah, I die and I live.", source: "Sahih al-Bukhari" },
          { cat: "Before Sleeping", ar: "قُلْ هُوَ اللَّهُ أَحَدٌ … قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ … قُلْ أَعُوذُ بِرَبِّ النَّاسِ", meaning: "Recite Al-Ikhlas, Al-Falaq and An-Nas, blowing gently into cupped hands and wiping over the body — as the Prophet ﷺ used to do before sleeping.", source: "Sahih al-Bukhari (narrated by Aisha)" },
          { cat: "Before Sleeping", ar: "اللَّهُمَّ بِاسْمِكَ أَمُوتُ وَأَحْيَا", meaning: "O Allah, in Your name I die and I live.", source: "Sahih al-Bukhari (Hadith 6324)" },
          { cat: "Before Sleeping", ar: "اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ", meaning: "O Allah, save me from Your punishment on the Day when You resurrect Your servants. (recite three times)", source: "Sunan Abi Dawud (Hadith 5045), at-Tirmidhi (Hadith 3398) — graded Sahih" },
          { cat: "Before Sleeping", ar: "سُبْحَانَ اللَّهِ (33) الْحَمْدُ لِلَّهِ (33) اللَّهُ أَكْبَرُ (34)", meaning: "SubhanAllah 33 times, Alhamdulillah 33 times, Allahu Akbar 34 times — this is better for you than a servant.", source: "Sahih al-Bukhari (Hadith 6318), Sahih Muslim (Hadith 2727)" },
          { cat: "Before Sleeping", ar: "اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ", meaning: "O Allah, I submit myself to You, entrust my affairs to You, turn my face to You, and lay myself down depending upon You, hoping in You and fearing You. There is no refuge and no escape from You except to You. I believe in Your Book which You have revealed and in Your Prophet whom You have sent.", source: "Sahih al-Bukhari (Hadith 247), Sahih Muslim (Hadith 2710)" },
          { cat: "Before Sleeping", ar: "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا، بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ", meaning: "In Your name, my Lord, I lay down my side, and by You I raise it. If You take my soul, have mercy on it; and if You release it, protect it as You protect Your righteous servants.", source: "Sahih al-Bukhari (Hadith 6320), Sahih Muslim (Hadith 2714)" },
          { cat: "Before Sleeping", ar: "اللَّهُمَّ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا، لَكَ مَمَاتُهَا وَمَحْيَاهَا، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ", meaning: "O Allah, You created my soul and You will take it. To You belongs its death and its life. If You keep it alive, protect it; and if You cause it to die, forgive it. O Allah, I ask You for well-being.", source: "Sahih Muslim (Hadith 2712)" },
          { cat: "Before Sleeping", ar: "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا، وَكَفَانَا، وَآوَانَا، فَكَمْ مِمَّنْ لَا كَافِيَ لَهُ وَلَا مُؤْوِيَ", meaning: "All praise is for Allah who fed us, gave us drink, sufficed us, and gave us shelter. How many are there who have no one to suffice them or shelter them.", source: "Sahih Muslim (Hadith 2715)" },
          { cat: "Before Sleeping", ar: "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ", meaning: "O Allah, Knower of the unseen and the witnessed, Originator of the heavens and the earth, Lord and Sovereign of all things, I bear witness that none has the right to be worshipped except You. I seek refuge in You from the evil of my own self and from the evil of Satan and his polytheism.", source: "Jami at-Tirmidhi (Hadith 3392) — graded Sahih" },

          { cat: "Dua (Quran)", ar: "رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ", meaning: "Our Lord, accept this from us. Indeed, You are the All-Hearing, the All-Knowing.", source: "Surah Al-Baqarah (2:127)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَا أُمَّةً مُّسْلِمَةً لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا إِنَّكَ أَنتَ التَّوَّابُ الرَّحِيمُ", meaning: "Our Lord, make us both Muslims submitting to You, and from our descendants a Muslim nation submitting to You. Show us our rites of worship and turn to us in mercy. Indeed, You are the Accepting of repentance, the Merciful.", source: "Surah Al-Baqarah (2:128)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", meaning: "Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.", source: "Surah Al-Baqarah (2:201)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", meaning: "Our Lord, pour upon us patience, make our steps firm, and give us victory over the disbelieving people.", source: "Surah Al-Baqarah (2:250)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", meaning: "Our Lord, do not hold us accountable if we forget or make mistakes. Our Lord, do not place on us a burden like that which You placed on those before us. Our Lord, do not impose on us that which we have no strength to bear. Pardon us, forgive us, and have mercy on us. You are our Protector, so grant us victory over the disbelieving people.", source: "Surah Al-Baqarah (2:286)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً إِنَّكَ أَنتَ الْوَهَّابُ", meaning: "Our Lord, let not our hearts deviate after You have guided us, and grant us mercy from Yourself. Indeed, You are the Bestower.", source: "Surah Aal-Imran (3:8)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنتَ خَيْرُ الرَّاحِمِينَ", meaning: "Our Lord, we have believed, so forgive us and have mercy upon us, and You are the best of the merciful.", source: "Surah Al-Mu'minun (23:109)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا آمَنَّا فَاكْتُبْنَا مَعَ الشَّاهِدِينَ", meaning: "Our Lord, we have believed, so register us among the witnesses.", source: "Surah Aal-Imran (3:53) and Al-Ma'idah (5:83)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", meaning: "Our Lord, forgive us our sins and our extravagance in our affairs, make our steps firm, and grant us victory over the disbelieving people.", source: "Surah Aal-Imran (3:147)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا مَا خَلَقْتَ هَذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ", meaning: "Our Lord, You did not create this in vain. Glory be to You, so protect us from the punishment of the Fire.", source: "Surah Aal-Imran (3:191)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ", meaning: "Our Lord, we have heard a caller calling to faith saying, 'Believe in your Lord,' so we believed. Our Lord, forgive us our sins, remove our evil deeds, and cause us to die with the righteous.", source: "Surah Aal-Imran (3:193)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَى رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ", meaning: "Our Lord, grant us what You promised us through Your messengers, and do not disgrace us on the Day of Resurrection. Indeed, You never break Your promise.", source: "Surah Aal-Imran (3:194)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", meaning: "Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy on us, we will surely be among the losers.", source: "Surah Al-A'raf (7:23)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا افْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِالْحَقِّ وَأَنتَ خَيْرُ الْفَاتِحِينَ", meaning: "Our Lord, judge between us and our people in truth, and You are the best of judges.", source: "Surah Al-A'raf (7:89)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا لَا تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ", meaning: "Our Lord, do not place us with the wrongdoing people.", source: "Surah Al-A'raf (7:47)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", meaning: "Our Lord, grant us mercy from Yourself and guide us rightly in our affair.", source: "Surah Al-Kahf (18:10)" },
          { cat: "Dua (Quran)", ar: "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي يَفْقَهُوا قَوْلِي", meaning: "My Lord, expand for me my chest, ease for me my task, and untie the knot from my tongue that they may understand my speech.", source: "Surah Ta-Ha (20:25-28)" },
          { cat: "Dua (Quran)", ar: "رَبِّ زِدْنِي عِلْمًا", meaning: "My Lord, increase me in knowledge.", source: "Surah Ta-Ha (20:114)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنتَ خَيْرُ الرَّاحِمِينَ", meaning: "Our Lord, we have believed, so forgive us and have mercy upon us, and You are the best of the merciful.", source: "Surah Al-Mu'minun (23:109)" },
          { cat: "Dua (Quran)", ar: "رَبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ", meaning: "My Lord, forgive and have mercy, and You are the best of the merciful.", source: "Surah Al-Mu'minun (23:118)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ إِنَّ عَذَابَهَا كَانَ غَرَامًا إِنَّهَا سَاءَتْ مُسْتَقَرًّا وَمُقَامًا", meaning: "Our Lord, avert from us the punishment of Hell. Indeed, its punishment is ever adhering. Indeed, it is an evil abode and place of rest.", source: "Surah Al-Furqan (25:65-66)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", meaning: "Our Lord, grant us from among our spouses and offspring comfort to our eyes, and make us leaders of the righteous.", source: "Surah Al-Furqan (25:74)" },
          { cat: "Dua (Quran)", ar: "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ وَاجْعَل لِّي لِسَانَ صِدْقٍ فِي الْآخِرِينَ وَاجْعَلْنِي مِن وَرَثَةِ جَنَّةِ النَّعِيمِ", meaning: "My Lord, grant me wisdom, join me with the righteous, grant me a truthful mention among later generations, and make me among the heirs of the Garden of Bliss.", source: "Surah Ash-Shu'ara (26:83-85)" },
          { cat: "Dua (Quran)", ar: "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ", meaning: "My Lord, make me an establisher of prayer, and from my descendants. Our Lord, and accept my supplication.", source: "Surah Ibrahim (14:40)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", meaning: "Our Lord, forgive me, my parents, and the believers on the Day when the reckoning is established.", source: "Surah Ibrahim (14:41)" },
          { cat: "Dua (Quran)", ar: "رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُن مِّنَ الْخَاسِرِينَ", meaning: "My Lord, I seek refuge in You from asking You about that of which I have no knowledge. And unless You forgive me and have mercy on me, I will be among the losers.", source: "Surah Hud (11:47)" },
          { cat: "Dua (Quran)", ar: "رَبِّ اجْعَلْ هَذَا الْبَلَدَ آمِنًا وَاجْنُبْنِي وَبَنِيَّ أَن نَّعْبُدَ الْأَصْنَامَ", meaning: "My Lord, make this city secure and keep me and my sons away from worshipping idols.", source: "Surah Ibrahim (14:35)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا إِنَّكَ تَعْلَمُ مَا نُخْفِي وَمَا نُعْلِنُ وَمَا يَخْفَى عَلَى اللَّهِ مِن شَيْءٍ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ", meaning: "Our Lord, indeed You know what we conceal and what we declare, and nothing is hidden from Allah on the earth or in the heaven.", source: "Surah Ibrahim (14:38)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلْقَوْمِ الظَّالِمِينَ وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ", meaning: "Our Lord, do not make us a trial for the wrongdoing people, and save us by Your mercy from the disbelieving people.", source: "Surah Yunus (10:85-86)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ", meaning: "Our Lord, pour upon us patience, and cause us to die as Muslims.", source: "Surah Al-A'raf (7:126)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا آمَنَّا فَاكْتُبْنَا مَعَ الشَّاهِدِينَ", meaning: "Our Lord, we have believed, so register us among the witnesses.", source: "Surah Al-Ma'idah (5:83)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا أَنزِلْ عَلَيْنَا مَائِدَةً مِّنَ السَّمَاءِ تَكُونُ لَنَا عِيدًا لِّأَوَّلِنَا وَآخِرِنَا وَآيَةً مِّنكَ وَارْزُقْنَا وَأَنتَ خَيْرُ الرَّازِقِينَ", meaning: "Our Lord, send down to us a table from the heaven to be for us a festival for the first and last of us, and a sign from You. And provide for us, and You are the best of providers.", source: "Surah Al-Ma'idah (5:114)" },
          { cat: "Dua (Quran)", ar: "رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ", meaning: "My Lord, do not leave me alone, and You are the best of inheritors.", source: "Surah Al-Anbya (21:89)" },
          { cat: "Dua (Quran)", ar: "رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ", meaning: "My Lord, grant me from Yourself a good offspring. Indeed, You are the Hearer of supplication.", source: "Surah Aal-Imran (3:38)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ", meaning: "Our Lord, we have believed in what You revealed and have followed the messenger, so register us among the witnesses.", source: "Surah Aal-Imran (3:53)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ", meaning: "Our Lord, forgive us and our brothers who preceded us in faith, and do not place in our hearts any resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful.", source: "Surah Al-Hashr (59:10)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ الْمَصِيرُ", meaning: "Our Lord, upon You we have relied, and to You we have returned, and to You is the destination.", source: "Surah Al-Mumtahanah (60:4)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَا إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", meaning: "Our Lord, perfect for us our light and forgive us. Indeed, You are over all things competent.", source: "Surah At-Tahrim (66:8)" },
          { cat: "Dua (Quran)", ar: "رَبَّنَا وَسِعْتَ كُلَّ شَيْءٍ رَّحْمَةً وَعِلْمًا فَاغْفِرْ لِلَّذِينَ تَابُوا وَاتَّبَعُوا سَبِيلَكَ وَقِهِمْ عَذَابَ الْجَحِيمِ", meaning: "Our Lord, You have encompassed all things in mercy and knowledge, so forgive those who have repented and followed Your way, and protect them from the punishment of Hellfire.", source: "Surah Ghafir (40:7)" },
          { cat: "Dua (Quran)", ar: "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ", meaning: "My Lord, enable me to be grateful for Your favour which You have bestowed upon me and upon my parents, and to do righteous work which pleases You. And admit me by Your mercy among Your righteous servants.", source: "Surah An-Naml (27:19)" },
          { cat: "Dua (Quran)", ar: "رَبِّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ", meaning: "My Lord, save me and my family from what they do.", source: "Surah Ash-Shu'ara (26:169)" },

          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ", meaning: "O Allah, I have greatly wronged myself, and none forgives sins but You. So grant me forgiveness from You and have mercy on me. Indeed, You are the Forgiving, the Merciful.", source: "Sahih al-Bukhari (834), Sahih Muslim (2705)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى", meaning: "O Allah, I ask You for guidance, piety, chastity and self-sufficiency.", source: "Sahih Muslim (2721)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ فِتْنَةِ النَّارِ، وَعَذَابِ النَّارِ، وَمِنْ شَرِّ الْغِنَى وَالْفَقْرِ", meaning: "O Allah, I seek refuge in You from the trial of the Fire, the punishment of the Fire, and from the evil of wealth and poverty.", source: "Sunan Abi Dawud (1543), Jami at-Tirmidhi (3495)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", meaning: "O Allah, Knower of the unseen and the witnessed, Originator of the heavens and the earth, Lord and Sovereign of all things, I bear witness that none has the right to be worshipped except You. I seek refuge in You from the evil of my own self and from the evil of Satan and his polytheism, and from committing wrong against myself or bringing it upon a Muslim.", source: "Jami at-Tirmidhi (3529) — graded Sahih by al-Albani" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ", meaning: "O Allah, I ask You for well-being in this life and the next.", source: "Sunan Abi Dawud (5074) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", meaning: "Allah is sufficient for us, and He is the best Disposer of affairs.", source: "Sahih al-Bukhari (4563)" },
          { cat: "Dua (Sunnah)", ar: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", meaning: "There is no might nor power except with Allah.", source: "Sahih al-Bukhari (6384), Sahih Muslim (2704)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَعِنِّي وَلَا تُعِنْ عَلَيَّ، وَانْصُرْنِي وَلَا تَنْصُرْ عَلَيَّ، وَامْكُرْ لِي وَلَا تَمْكُرْ عَلَيَّ، وَاهْدِنِي وَيَسِّرِ الْهُدَى لِي", meaning: "O Allah, help me and do not help against me. Grant me victory and do not grant victory over me. Plan for me and do not plan against me. Guide me and make guidance easy for me.", source: "Jami at-Tirmidhi (3551), Sunan Ibn Majah (3830) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الْأَمْرِ، وَالْعَزِيمَةَ عَلَى الرُّشْدِ، وَأَسْأَلُكَ شُكْرَ نِعْمَتِكَ، وَحُسْنَ عِبَادَتِكَ", meaning: "O Allah, I ask You for steadfastness in this matter, determination in following the right path, gratitude for Your blessings, and excellence in worship.", source: "Sunan an-Nasa'i (1305) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنَ الْخَيْرِ كُلِّهِ، عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ", meaning: "O Allah, I ask You for all that is good, in the immediate and the future, what I know of it and what I do not know.", source: "Sunan Ibn Majah (3846) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَالْهَرَمِ وَعَذَابِ الْقَبْرِ", meaning: "O Allah, I seek refuge in You from incapacity, laziness, cowardice, miserliness, old age, and the punishment of the grave.", source: "Sahih al-Bukhari (6367)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَقَهْرِ الرِّجَالِ", meaning: "O Allah, I seek refuge in You from worry and grief, incapacity and laziness, miserliness and cowardice, the burden of debt, and being overpowered by men.", source: "Sahih al-Bukhari (6363), Sahih Muslim (2707)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ، وَتَحَوُّلِ عَافِيَتِكَ، وَفُجَاءَةِ نِقْمَتِكَ، وَجَمِيعِ سَخَطِكَ", meaning: "O Allah, I seek refuge in You from the removal of Your blessing, the change of Your protection, the suddenness of Your punishment, and all that displeases You.", source: "Sahih Muslim (2739)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ", meaning: "O Allah, I ask You for Paradise and seek refuge in You from the Fire.", source: "Sunan Abi Dawud (792) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا", meaning: "O Allah, I ask You for beneficial knowledge, good provision, and accepted deeds.", source: "Sunan Ibn Majah (925) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", meaning: "Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.", source: "Sahih al-Bukhari (6389)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ وَرَحْمَتِكَ، فَإِنَّهُ لَا يَمْلِكُهَا إِلَّا أَنْتَ", meaning: "O Allah, I ask You from Your bounty and mercy, for none possesses them except You.", source: "Al-Adab Al-Mufrad (1219) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي", meaning: "O Allah, set right my religion which is the safeguard of my affairs, set right my worldly life in which is my livelihood, and set right my Hereafter to which is my return.", source: "Sahih Muslim (2720)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْ خَيْرَ عُمْرِي آخِرَهُ، وَخَيْرَ عَمَلِي خَاتِمَتَهُ، وَخَيْرَ أَيَّامِي يَوْمَ أَلْقَاكَ", meaning: "O Allah, make the best part of my life its end, the best of my deeds its conclusion, and the best of my days the Day I meet You.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَحْسِنْ عَاقِبَتَنَا فِي الْأُمُورِ كُلِّهَا، وَأَجِرْنَا مِنْ خِزْيِ الدُّنْيَا وَعَذَابِ الْآخِرَةِ", meaning: "O Allah, make our outcome good in all affairs, and save us from the disgrace of this world and the punishment of the Hereafter.", source: "Ahmad (5/255) — graded Sahih by al-Albani" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ", meaning: "O Allah, Turner of hearts, make my heart firm upon Your religion.", source: "Jami at-Tirmidhi (2140) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ", meaning: "O Turner of hearts, make my heart firm upon Your religion.", source: "Jami at-Tirmidhi (3522) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ", meaning: "O Allah, Director of hearts, direct our hearts to Your obedience.", source: "Sahih Muslim (2654)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي", meaning: "O Allah, I ask You for pardon and well-being in my religion, my worldly affairs, my family and my wealth.", source: "Abu Dawud (5074) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي", meaning: "O Allah, conceal my faults and calm my fears.", source: "Abu Dawud (5074) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", meaning: "O Allah, protect me from in front of me, from behind me, from my right and my left, and from above me. I seek refuge in Your greatness from being swallowed up from beneath me.", source: "Abu Dawud (5074) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ", meaning: "O Allah, grant my body health, O Allah, grant my hearing health, O Allah, grant my sight health. None has the right to be worshipped except You.", source: "Abu Dawud (5090) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ", meaning: "O Allah! I seek refuge in You from disbelief and poverty. O Allah! I seek refuge in You from the punishment of the grave. There is no god but You.", source: "Abu Dawud (5090) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ", meaning: "O Allah, suffice me with what You have made lawful so I have no need of what You have made unlawful, and enrich me by Your bounty so I have no need of anyone besides You.", source: "Jami at-Tirmidhi (3563) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ ﷺ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا اسْتَعَاذَ بِكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ ﷺ", meaning: "O Allah, I ask You for the good which Your Prophet Muhammad ﷺ asked of You, and I seek refuge in You from the evil from which Your Prophet Muhammad ﷺ sought refuge in You.", source: "Jami at-Tirmidhi (3521) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", meaning: "O Allah, help me to remember You, to give thanks to You, and to worship You in the best manner.", source: "Sunan Abi Dawud (1522) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا وَعَذَابِ الْقَبْرِ", meaning: "O Allah, I seek refuge in You from miserliness, and I seek refuge in You from cowardice, and I seek refuge in You from being returned to the most decrepit age, and I seek refuge in You from the trials of this world and the punishment of the grave.", source: "Sahih al-Bukhari (6374)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ، وَمِنْ شَرِّ مَا لَمْ أَعْمَلْ", meaning: "O Allah, I seek refuge in You from the evil of what I have done, and from the evil of what I have not done.", source: "Sahih Muslim (2716)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ مُنْكَرَاتِ الْأَخْلَاقِ، وَالْأَعْمَالِ، وَالْأَهْوَاءِ، وَالْأَدْوَاءِ", meaning: "O Allah, I seek refuge in You from bad manners, deeds, desires, and diseases.", source: "Jami at-Tirmidhi (3591) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ طَهِّرْ قَلْبِي مِنَ النِّفَاقِ، وَعَمَلِي مِنَ الرِّيَاءِ، وَلِسَانِي مِنَ الْكَذِبِ، وَعَيْنِي مِنَ الْخِيَانَةِ، فَإِنَّكَ تَعْلَمُ خَائِنَةَ الْأَعْيُنِ وَمَا تُخْفِي الصُّدُورُ", meaning: "O Allah, purify my heart from hypocrisy, my deeds from showing off, my tongue from lying, and my eye from treachery. For You know the treachery of the eyes and what the hearts conceal.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ إِيمَانًا لَا يَرْتَدُّ، وَنَعِيمًا لَا يَنْفَدُ، وَمُرَافَقَةَ النَّبِيِّ ﷺ فِي أَعْلَى جَنَّةِ الْخُلْدِ", meaning: "O Allah, I ask You for faith that does not waver, blessings that do not end, and the company of the Prophet ﷺ in the highest garden of eternal bliss.", source: "Ahmad (4/192) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَعَمَلًا صَالِحًا وَهِدَايَةً وَرِزْقًا حَلَالًا", meaning: "O Allah, I ask You for beneficial knowledge, righteous deeds, guidance, and lawful provision.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ صِحَّةً فِي إِيمَانٍ، وَإِيمَانًا فِي حُسْنِ خُلُقٍ، وَنَجَاحًا يَتْبَعُهُ فَلَاحٌ، وَرَحْمَةً مِنْكَ وَعَافِيَةً، وَمَغْفِرَةً مِنْكَ وَرِضْوَانًا", meaning: "O Allah, I ask You for sound health in faith, faith in good character, success followed by prosperity, mercy and well-being from You, and forgiveness and pleasure from You.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ عَافِنِي فِي بَدَنِي، وَعَافِنِي فِي سَمْعِي، وَعَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ", meaning: "O Allah, grant my body health, my hearing health, and my sight health. None has the right to be worshipped except You.", source: "Abu Dawud (5090) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ", meaning: "O Allah, I seek refuge in You from worry and grief, from incapacity and laziness, from cowardice and miserliness, from being heavily in debt, and from being overpowered by men.", source: "Sahih al-Bukhari (2893)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ جَهَنَّمَ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ", meaning: "O Allah, I seek refuge in You from the punishment of the grave, from the punishment of Hell, from the trials of life and death, and from the evil of the trial of the False Messiah.", source: "Sahih Muslim (588)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعُوذُ بِكَ مِنْ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ", meaning: "O Allah, I seek refuge in You from cowardice, miserliness, and being returned to the most decrepit age.", source: "Sahih al-Bukhari (4707)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ يَوْمِ السُّوءِ، وَمِنْ لَيْلَةِ السُّوءِ، وَمِنْ سَاعَةِ السُّوءِ، وَمِنْ صَاحِبِ السُّوءِ", meaning: "O Allah, I seek refuge in You from an evil day, an evil night, an evil hour, and an evil companion.", source: "Al-Adab Al-Mufrad (655) — graded Sahih by al-Albani" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ سَمْعِي، وَمِنْ شَرِّ بَصَرِي، وَمِنْ شَرِّ لِسَانِي، وَمِنْ شَرِّ قَلْبِي، وَمِنْ شَرِّ مَنِيِّي", meaning: "O Allah, I seek refuge in You from the evil of my hearing, my sight, my tongue, my heart, and my desire.", source: "Sunan Abi Dawud (1551) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ جَارِ السُّوءِ فِي دَارِ الْمُقَامَةِ، فَإِنَّ جَارَ الْبَادِيَةِ يَتَحَوَّلُ", meaning: "O Allah, I seek refuge in You from an evil neighbour in the permanent residence, for the neighbour of the desert moves on.", source: "Al-Adab Al-Mufrad (654) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُوعِ، فَإِنَّهُ بِئْسَ الضَّجِيعُ، وَأَعُوذُ بِكَ مِنَ الْخِيَانَةِ، فَإِنَّهَا بِئْسَتِ الْبِطَانَةُ", meaning: "O Allah, I seek refuge in You from hunger, for it is an evil bedfellow, and I seek refuge in You from treachery, for it is an evil hidden trait.", source: "Sunan Abi Dawud (1547) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْمُعَافَاةَ فِي الدُّنْيَا وَالْآخِرَةِ", meaning: "O Allah, I ask You for full protection in this life and the next.", source: "Abu Dawud (5074) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ عِلْمِكَ مَا يُقَرِّبُنِي إِلَى رَحْمَتِكَ، وَمِنْ رِضَاكَ مَا يُبَلِّغُنِي جَنَّتَكَ", meaning: "O Allah, I ask You for such knowledge of Yours as brings me closer to Your mercy, and such pleasure of Yours as admits me to Your Paradise.", source: "Jami at-Tirmidhi (3543) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الصِّحَّةَ وَالْعِفَّةَ وَالْأَمَانَةَ وَحُسْنَ الْخُلُقِ وَالرِّضَا بِالْقَدَرِ", meaning: "O Allah, I ask You for health, chastity, trustworthiness, good character, and contentment with Your decree.", source: "Ahmad (2/187), Al-Adab Al-Mufrad (307) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْحَرَامِ وَمَا يُقَرِّبُنِي إِلَيْهِ", meaning: "O Allah, I seek refuge in You from the forbidden and from all that brings me closer to it.", source: "Ahmad (1/285) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ", meaning: "O Allah, guide me among those You have guided, grant me well-being among those You have granted well-being, and take me as a close ally among those You have taken as close allies.", source: "Sunan Abi Dawud (1425), Jami at-Tirmidhi (464) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ بَارِكْ لِي فِي مَا رَزَقْتَنِي وَقِنِي شَرَّ مَا مَنَعْتَنِي", meaning: "O Allah, bless me in what You have provided me and protect me from the evil of what You have withheld from me.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالسَّدَادَ", meaning: "O Allah, I ask You for guidance and steadfastness.", source: "Sahih Muslim (2725)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ كُلِّ خَيْرٍ سَأَلَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ ﷺ، وَأَعُوذُ بِكَ مِنْ كُلِّ شَرٍّ اسْتَعَاذَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ ﷺ", meaning: "O Allah, I ask You for every good which Your Prophet Muhammad ﷺ asked of You, and I seek refuge in You from every evil from which Your Prophet Muhammad ﷺ sought refuge in You.", source: "Jami at-Tirmidhi (3521) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ الْعِلْمِ وَخَيْرَ الْعَمَلِ وَخَيْرَ النَّتِيجَةِ", meaning: "O Allah, I ask You for the best of knowledge, the best of deeds, and the best of outcomes.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ نَفْسًا بِكَ مُطْمَئِنَّةً، تُؤْمِنُ بِلِقَائِكَ، وَتَرْضَى بِقَضَائِكَ", meaning: "O Allah, I ask You for a soul that finds tranquillity in You, that believes in meeting You, and that is content with Your decree.", source: "Sunan an-Nasa'i (1305) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ وَسُوءِ الْعُمْرِ", meaning: "O Allah, I seek refuge in You from cowardice, miserliness, and a bad old age.", source: "Sahih al-Bukhari (2822)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ عَافِنِي مِنْ كُلِّ سُوءٍ", meaning: "O Allah, protect me from every evil.", source: "Abu Dawud (5090) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الصِّحَّةَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي", meaning: "O Allah, I ask You for health and well-being in my religion, my worldly affairs, my family, and my wealth.", source: "Abu Dawud (5074) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا أَعْلَمُ، وَمِنْ شَرِّ مَا لَا أَعْلَمُ", meaning: "O Allah, I seek refuge in You from the evil of what I know, and from the evil of what I do not know.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ثَبِّتْنِي عَلَى الْحَقِّ وَلَا تُزِغْ قَلْبِي", meaning: "O Allah, keep me firm upon the truth and do not let my heart deviate.", source: "Ahmad (4/305) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَمَا يُقَرِّبُنِي إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ", meaning: "O Allah, I ask You for Paradise and for whatever brings me closer to it, whether by word or by deed.", source: "Jami at-Tirmidhi (3541) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَعِنِّي عَلَى شُكْرِ نِعْمَتِكَ وَحُسْنِ عِبَادَتِكَ", meaning: "O Allah, help me to be grateful for Your blessing and to worship You well.", source: "Sunan Abi Dawud (1522) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَعْطِنِي مِنْ خَيْرِ مَا تُعْطِي عِبَادَكَ الصَّالِحِينَ", meaning: "O Allah, grant me the best of what You grant Your righteous servants.", source: "Ahmad (3/313) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَجِرْنِي مِنَ النَّارِ", meaning: "O Allah, protect me from the Fire.", source: "Sunan Abi Dawud (792) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَنَعِيمَهَا وَمَا يُقَرِّبُنِي إِلَيْهَا", meaning: "O Allah, I ask You for Paradise and its bliss, and all that brings me closer to it.", source: "Ahmad (5/406) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَهَ إِلَّا أَنْتَ", meaning: "O Allah, it is Your mercy that I hope for, so do not leave me to myself even for the blink of an eye. Set right all my affairs. There is no god but You.", source: "Sunan Abi Dawud (5090) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَرَمِ وَالْبُخْلِ وَالْجُبْنِ وَالْفِتَنِ", meaning: "O Allah, I seek refuge in You from senility, miserliness, cowardice, and trials.", source: "Sahih al-Bukhari (6370)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ الصَّالِحِينَ وَمِنَ الْمُتَّقِينَ", meaning: "O Allah, make me among the righteous and among the God-fearing.", source: "Ahmad (1/247) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ لَا تَدَعْ لَنَا ذَنْبًا إِلَّا غَفَرْتَهُ، وَلَا هَمًّا إِلَّا فَرَّجْتَهُ، وَلَا دَيْنًا إِلَّا قَضَيْتَهُ", meaning: "O Allah, do not leave for us any sin but that You forgive it, nor any worry but that You relieve it, nor any debt but that You settle it.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْ آخِرَ كَلَامِي مِنَ الدُّنْيَا لَا إِلَهَ إِلَّا اللَّهُ", meaning: "O Allah, make my last words in this world, 'There is no god but Allah.'", source: "Sunan Abi Dawud (3116) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ لَا تَجْعَلْ قَلْبِي قَاسِيًا، وَاجْعَلْنِي مِنَ الْخَاشِعِينَ", meaning: "O Allah, do not make my heart hard, and make me among those who are humble before You.", source: "Ahmad (3/490) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ إِيمَانًا كَامِلًا، وَيَقِينًا صَادِقًا", meaning: "O Allah, I ask You for complete faith and truthful certainty.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَلْهِمْنِي رُشْدِي، وَأَعِذْنِي مِنْ شَرِّ نَفْسِي", meaning: "O Allah, inspire me with my right guidance, and protect me from the evil of my own self.", source: "Jami at-Tirmidhi (3483) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الطَّيِّبَاتِ وَتَرْكَ الْمُنْكَرَاتِ، وَحُبَّ الْمَسَاكِينِ", meaning: "O Allah, I ask You for good things, for abandoning evil deeds, and for love of the poor.", source: "Jami at-Tirmidhi (3235) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَعِنِّي عَلَى حُسْنِ عِبَادَتِكَ وَطَاعَتِكَ", meaning: "O Allah, help me to worship You beautifully and to obey You.", source: "Abu Dawud (1522) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ارْزُقْنِي حُبَّكَ، وَحُبَّ مَنْ يَنْفَعُنِي حُبُّهُ عِنْدَكَ", meaning: "O Allah, grant me Your love, and the love of those whose love benefits me with You.", source: "Jami at-Tirmidhi (3490) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ", meaning: "O Allah, make me among those who listen to the word and follow the best of it.", source: "Ahmad (4/412) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَحُبَّ الْعَمَلِ الَّذِي يُبَلِّغُنِي حُبَّكَ", meaning: "O Allah, I ask You for Your love, for the love of those who love You, and for the love of deeds which bring me closer to Your love.", source: "Jami at-Tirmidhi (3490) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ طَهِّرْ قَلْبِي مِنَ النِّفَاقِ، وَعَمَلِي مِنَ الرِّيَاءِ", meaning: "O Allah, purify my heart from hypocrisy and my deeds from showing off.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ الذَّاكِرِينَ الشَّاكِرِينَ الصَّابِرِينَ", meaning: "O Allah, make me among those who remember You, thank You, and are patient.", source: "Ahmad (2/176) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ وَالْمُعَافَاةَ الدَّائِمَةَ فِي الدِّينِ وَالدُّنْيَا وَالْآخِرَةِ", meaning: "O Allah, I ask You for pardon, well-being, and lasting protection in my religion, worldly life, and Hereafter.", source: "Al-Adab Al-Mufrad (699) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ الْمُحْسِنِينَ", meaning: "O Allah, make me among those who do good.", source: "Ahmad (2/255) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ثَبِّتْ قَلْبِي عَلَى الْإِيمَانِ", meaning: "O Allah, keep my heart firm upon faith.", source: "Sahih Muslim (2654)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَصْلِحْ قَلْبِي وَنَقِّهِ مِنَ الْحِقْدِ وَالْحَسَدِ", meaning: "O Allah, set right my heart and purify it from malice and envy.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَغْنِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَاكْفِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ", meaning: "O Allah, enrich me with the lawful so that I have no need of the unlawful, and suffice me with Your bounty so that I have no need of anyone besides You.", source: "Jami at-Tirmidhi (3563) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ", meaning: "O Allah, I ask You for Paradise and seek refuge in You from the Fire.", source: "Sunan Abi Dawud (792) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ حَبِّبْ إِلَيَّ الْإِيمَانَ وَزَيِّنْهُ فِي قَلْبِي، وَكَرِّهْ إِلَيَّ الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ", meaning: "O Allah, make faith beloved to me and beautify it in my heart, and make disbelief, transgression, and disobedience hateful to me.", source: "Ahmad (3/128) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنْ أَهْلِ الْقُرْآنِ وَأَهْلِ الْإِيمَانِ", meaning: "O Allah, make me among the people of the Qur'an and the people of faith.", source: "Ahmad (3/437) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ارْزُقْنِي حُسْنَ الْخَاتِمَةِ", meaning: "O Allah, grant me a good end.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ لَا تَجْعَلِ الدُّنْيَا أَكْبَرَ هَمِّي وَلَا مَبْلَغَ عِلْمِي", meaning: "O Allah, do not make the world my greatest concern nor the limit of my knowledge.", source: "Jami at-Tirmidhi (3502) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَعْطِنِي حُسْنَ الْخُلُقِ كَمَا أَعْطَيْتَنِي حُسْنَ الْخَلْقِ", meaning: "O Allah, grant me good character just as You granted me good appearance.", source: "Ahmad (6/68) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الرَّاحَةَ عِنْدَ الْمَوْتِ وَالطُّمَأْنِينَةَ عِنْدَ الْحِسَابِ", meaning: "O Allah, I ask You for ease at death and tranquillity at the Reckoning.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ارْزُقْنِي مِنْ فَضْلِكَ وَرَحْمَتِكَ، فَإِنَّهُ لَا يَمْلِكُهَا إِلَّا أَنْتَ", meaning: "O Allah, grant me from Your bounty and mercy, for none possesses them except You.", source: "Al-Adab Al-Mufrad (1219) — graded Sahih" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنْ أَوَّلِ الدَّاخِلِينَ إِلَى الْجَنَّةِ", meaning: "O Allah, make me among the first to enter Paradise.", source: "Jami at-Tirmidhi (3523) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ لَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", meaning: "O Allah, do not leave me to myself even for the blink of an eye.", source: "Sunan Abi Dawud (5090) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ وَالْمَغْفِرَةَ وَالرَّحْمَةَ", meaning: "O Allah, I ask You for well-being, forgiveness, and mercy.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ نَقِّنِي مِنَ الذُّنُوبِ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ", meaning: "O Allah, cleanse me of my sins as a white garment is cleansed of filth.", source: "Sahih Muslim (476)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ الْمُتَوَكِّلِينَ عَلَيْكَ", meaning: "O Allah, make me among those who place their trust in You.", source: "Ahmad (4/412) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ارْزُقْنِي حَلَالًا طَيِّبًا وَاجْعَلْنِي مِنَ الشَّاكِرِينَ", meaning: "O Allah, grant me lawful and good provision, and make me among the grateful.", source: "Ahmad (3/176) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ النَّعِيمَ الْمُقِيمَ الَّذِي لَا يَزُولُ وَلَا يَنْفَدُ", meaning: "O Allah, I ask You for lasting bliss that never ends and never fades.", source: "Ahmad (4/364) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ جَنِّبْنِي مُنْكَرَاتِ الْأَخْلَاقِ وَالْأَعْمَالِ وَالْأَهْوَاءِ وَالْأَدْوَاءِ", meaning: "O Allah, keep me away from bad manners, deeds, desires, and diseases.", source: "Jami at-Tirmidhi (3591) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنْ عِبَادِكَ الصَّالِحِينَ", meaning: "O Allah, make me among Your righteous servants.", source: "Ahmad (3/128) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَسْعِدْنِي فِي الدُّنْيَا وَالْآخِرَةِ", meaning: "O Allah, make me happy in this world and the Hereafter.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْخَيْرَ كُلَّهُ وَلَا أَسْأَلُكَ الشَّرَّ", meaning: "O Allah, I ask You for all good, and I do not ask You for any evil.", source: "Ahmad (3/268) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ بَارِكْ لِي فِي دِينِي وَدُنْيَايَ وَآخِرَتِي", meaning: "O Allah, bless me in my religion, my worldly affairs, and my Hereafter.", source: "Ahmad (4/372) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْ قَلْبِي نَقِيًّا مِنْ كُلِّ سُوءٍ", meaning: "O Allah, make my heart pure from every evil.", source: "Ahmad (3/128) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَكْرِمْنِي بِالْإِيمَانِ وَالْإِسْلَامِ وَالْإِحْسَانِ", meaning: "O Allah, honour me with faith, Islam, and excellence in worship.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ارْزُقْنِي بِرَّ وَالِدَيَّ وَاجْعَلْنِي مِنَ الْبَارِّينَ", meaning: "O Allah, grant me kindness to my parents and make me among the dutiful.", source: "Ahmad (5/382) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ الْمُتَّقِينَ الَّذِينَ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", meaning: "O Allah, make me among the righteous who will have no fear nor will they grieve.", source: "Ahmad (4/234) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ، وَاجْعَلْ آخِرَ كَلَامِي مِنَ الدُّنْيَا لَا إِلَهَ إِلَّا اللَّهُ", meaning: "O Allah, help me to remember You, thank You, and worship You beautifully, and make my last words in this world 'There is no god but Allah.'", source: "Abu Dawud (1522), Muslim (2710)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ", meaning: "O Allah, forgive me, my parents, and all believing men and women.", source: "Ahmad (5/252) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنْ أَهْلِ الْجَنَّةِ وَبَاعِدْنِي مِنَ النَّارِ", meaning: "O Allah, make me among the people of Paradise and distance me from the Fire.", source: "Ahmad (3/461) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْ خَيْرَ عُمْرِي آخِرَهُ وَخَيْرَ عَمَلِي خَاتِمَتَهُ وَخَيْرَ أَيَّامِي يَوْمَ أَلْقَاكَ", meaning: "O Allah, make the best part of my life its end, the best of my deeds its conclusion, and the best of my days the Day I meet You.", source: "Al-Mu'jam al-Awsat by al-Tabarani — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَنْزِلْنِي مَنْزِلًا مُبَارَكًا وَأَنْتَ خَيْرُ الْمُنْزِلِينَ", meaning: "O Allah, let me land in a blessed place, for You are the best of hosts.", source: "Surah Al-Mu'minun (23:29) — supplication" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ لَا تُخْزِنِي يَوْمَ يُبْعَثُونَ، يَوْمَ لَا يَنفَعُ مَالٌ وَلَا بَنُونَ، إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ", meaning: "O Allah, do not disgrace me on the Day when they are resurrected, the Day when neither wealth nor children will benefit anyone, except the one who comes to Allah with a sound heart.", source: "Surah Ash-Shu'ara (26:87-89)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنَ الْمُقَرَّبِينَ وَمِنْ عِبَادِكَ الْمُخْلَصِينَ", meaning: "O Allah, make me among those brought near to You and among Your sincere servants.", source: "Ahmad (3/128) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ارْزُقْنِي مَحَبَّتَكَ وَمَحَبَّةَ مَنْ يَنْفَعُنِي مَحَبَّتُهُ عِنْدَكَ", meaning: "O Allah, grant me Your love and the love of those whose love benefits me with You.", source: "Jami at-Tirmidhi (3490) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى، وَأَعُوذُ بِكَ مِنَ الْفَقْرِ وَالْكُفْرِ", meaning: "O Allah, I ask You for guidance, piety, chastity, and self-sufficiency, and I seek refuge in You from poverty and disbelief.", source: "Sahih Muslim (2721), Abu Dawud (5090)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ارْحَمْنِي بِرَحْمَتِكَ الَّتِي وَسِعَتْ كُلَّ شَيْءٍ", meaning: "O Allah, have mercy on me with the mercy that encompasses all things.", source: "Ahmad (4/170) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اخْتِمْ لِي بِخَيْرٍ وَاجْعَلْ عَاقِبَتِي إِلَى خَيْرٍ", meaning: "O Allah, seal my life with goodness and make my ending good.", source: "Ahmad (6/315) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ يَسِّرْ لِي كُلَّ عَسِيرٍ وَسَهِّلْ لِي كُلَّ صَعْبٍ", meaning: "O Allah, make every difficulty easy for me and make every hardship smooth for me.", source: "Ahmad (2/185) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اشْفِنِي شِفَاءً لَا يُغَادِرُ سَقَمًا", meaning: "O Allah, heal me with a healing that leaves behind no illness.", source: "Sahih al-Bukhari (5675)" },
          { cat: "Dua (Sunnah)", ar: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ", meaning: "I seek refuge in the perfect words of Allah from every devil, every venomous creature, and every evil eye.", source: "Sahih al-Bukhari (3371)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا", meaning: "O Allah, I seek refuge in You from knowledge that does not benefit, from a heart that is not humble, from a soul that is not satisfied, and from a supplication that is not answered.", source: "Sahih Muslim (2722)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ احْفَظْنِي بِحِفْظِكَ، وَتَوَلَّنِي بِرِعَايَتِكَ", meaning: "O Allah, protect me with Your protection and take care of me with Your care.", source: "Ahmad (4/217) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ طَهِّرْ لِي قَلْبِي وَنَقِّ لِي عَمَلِي", meaning: "O Allah, purify my heart for me and cleanse my deeds for me.", source: "Ahmad (4/340) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ لَا تَجْعَلْ فِي قَلْبِي غِلًّا لِلْمُؤْمِنِينَ", meaning: "O Allah, do not place any resentment in my heart toward the believers.", source: "Surah Al-Hashr (59:10)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ارْزُقْنِي حُبَّكَ وَحُبَّ رَسُولِكَ ﷺ", meaning: "O Allah, grant me the love of You and the love of Your Messenger ﷺ.", source: "Jami at-Tirmidhi (3490) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ أَعِنِّي عَلَى طَاعَتِكَ وَاجْعَلْنِي مِنْ عِبَادِكَ الصَّالِحِينَ الْمُخْلَصِينَ", meaning: "O Allah, help me to obey You and make me among Your righteous and sincere servants.", source: "Ahmad (3/128) — graded Hasan" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ ثَبِّتْنِي بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ", meaning: "O Allah, keep me firm with the steadfast word in this life and in the Hereafter.", source: "Sahih al-Bukhari (1369)" },
          { cat: "Dua (Sunnah)", ar: "اللَّهُمَّ اجْعَلْنِي مِنْ عِبَادِكَ الشَّاكِرِينَ الصَّابِرِينَ الذَّاكِرِينَ", meaning: "O Allah, make me among Your grateful, patient, and ever-remembering servants.", source: "Ahmad (2/176) — graded Hasan" },

          { cat: "General", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", meaning: "Glory be to Allah, and praise be to Him.", source: "Sahih al-Bukhari, Sahih Muslim" },
          { cat: "General", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", meaning: "How perfect Allah is and I praise Him by the number of His creation, His pleasure, the weight of His throne, and the ink of His words.", source: "Sahih Muslim (2726)" },
          { cat: "General", ar: "سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ", meaning: "Glory be to Allah, praise be to Allah, there is no god but Allah, and Allah is the Greatest.", source: "Sahih Muslim (2694)" },
          { cat: "General", ar: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ", meaning: "Glory be to Allah and praise be to Him; glory be to Allah, the Magnificent. (Two phrases light on the tongue, heavy on the scales, beloved to the Most Merciful)", source: "Sahih al-Bukhari (6406), Sahih Muslim (2694)" },
          { cat: "General", ar: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", meaning: "There is no god but Allah alone, He has no partner. His is the dominion and His is the praise, and He is capable of all things. (recite 100 times daily)", source: "Sahih al-Bukhari (3293), Sahih Muslim (2691)" },
          { cat: "General", ar: "سُبْحَانَ اللَّهِ", meaning: "Glory be to Allah.", source: "Sahih Muslim (2691)" },
          { cat: "General", ar: "الْحَمْدُ لِلَّهِ", meaning: "All praise is for Allah.", source: "Sahih Muslim (2137)" },
          { cat: "General", ar: "اللَّهُ أَكْبَرُ", meaning: "Allah is the Greatest.", source: "Sahih al-Bukhari (6218)" },
          { cat: "General", ar: "لَا إِلَهَ إِلَّا اللَّهُ", meaning: "There is no god but Allah.", source: "Sahih Muslim (2691)" },
          { cat: "General", ar: "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", meaning: "I seek forgiveness from Allah and turn to Him in repentance. (recite 100 times daily)", source: "Sahih al-Bukhari (6307), Sahih Muslim (2702)" },
