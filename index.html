           function getRoutineStruct(d) {
  const dateToCheck = d || new Date();
  const dateKey = dateStr(dateToCheck);
  const isWeekendDay = dateToCheck.getDay() === 0 || dateToCheck.getDay() === 6;

  // Effective Holiday Mode for this specific date.
  // - If the user has explicitly saved a value for this date, honour it.
  // - Otherwise fall back to the natural weekday/weekend default.
  // A weekday with no explicit entry is NEVER treated as holiday.
  let isHoliday;
  if (S.settings && S.settings.holidayDates && S.settings.holidayDates[dateKey] !== undefined) {
    isHoliday = S.settings.holidayDates[dateKey] === true;
  } else {
    isHoliday = isWeekendDay;
  }

  // Pick the correct stored routine for this day type.
  // S.routineStruct holds BOTH: { weekday: [...], weekend: [...] }
  let baseStruct;
  if (S.routineStruct && Array.isArray(S.routineStruct.weekday) && Array.isArray(S.routineStruct.weekend)) {
    baseStruct = isHoliday ? S.routineStruct.weekend : S.routineStruct.weekday;
  } else {
    baseStruct = isHoliday ? ROUTINE_STRUCT_WEEKEND : ROUTINE_STRUCT_DEFAULT;
  }

  if (!Array.isArray(baseStruct)) {
    baseStruct = isHoliday ? ROUTINE_STRUCT_WEEKEND : ROUTINE_STRUCT_DEFAULT;
  }

  // Filter out deleted items
  return baseStruct.map(section => {
    const [secKey, secLabel, items] = section;
    const filteredItems = (items || []).filter(item => {
      const itemKey = item[0];
      return !S.deletedRoutineItems.includes(itemKey);
    });
    return [secKey, secLabel, filteredItems];
  }).filter(section => section[2].length > 0);
}

                     function cloneDefaultRoutine(d) {
  const dateToCheck = d || new Date();
  const dateKey = dateStr(dateToCheck);
  const isWeekendDay = dateToCheck.getDay() === 0 || dateToCheck.getDay() === 6;

  let isHoliday;
  if (S.settings && S.settings.holidayDates && S.settings.holidayDates[dateKey] !== undefined) {
    isHoliday = S.settings.holidayDates[dateKey] === true;
  } else {
    isHoliday = isWeekendDay;
  }

  const base = isHoliday ? ROUTINE_STRUCT_WEEKEND : ROUTINE_STRUCT_DEFAULT;

  // Deep clone it so we don't modify the original arrays
  return base.map(([key, label, items]) =>
    [key, label, items.map(([ik, il]) => [ik, il])]
  );

  function cloneStructure(struct) {
  return (struct || []).map(([k, l, items]) => [k, l, (items || []).map(([ik, il]) => [ik, il])]);
}

async function saveRoutineStruct(struct) {
  const viewDate = S.routineViewDate ? new Date(S.routineViewDate + 'T12:00:00') : new Date();

    isHoliday = S.settings.holidayDates[dateKey];
  } else {
    isHoliday = isWeekendDay;
  }

  // Keep a stable object holding BOTH weekday and weekend structures.
  if (!S.routineStruct || !S.routineStruct.weekday || !S.routineStruct.weekend) {
    S.routineStruct = {
      weekday: cloneStructure(ROUTINE_STRUCT_DEFAULT),
      weekend: cloneStructure(ROUTINE_STRUCT_WEEKEND)
    };
  }

  if (isHoliday) {
    S.routineStruct.weekend = cloneStructure(struct);
  } else {
    S.routineStruct.weekday = cloneStructure(struct);
  }

  await setJSON('routine-struct', S.routineStruct);

          async function prefetchQuranSurah(num) {
      if (_quranDataCache[num]) return _quranDataCache[num];

      const cacheKey = 'quran-surah-indopak-v2-' + num;
      try {
        const raw = localStorage.getItem(cacheKey);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Date.now() - (parsed.__cachedAt || 0) < 30 * 24 * 3600 * 1000) {
            _quranDataCache[num] = parsed;
            return parsed;
          }
        }
      } catch (e) { }

      try {
        const [arabicResp, englishResp] = await Promise.all([
              fetch('https://api.quran.com/api/v4/quran/verses/indopak?chapter_number=' + num),
          fetch('https://api.quran.com/api/v4/quran/translations/20?chapter_number=' + num)
        ]);
        if (!arabicResp.ok || !englishResp.ok) throw new Error('API error');
        const arabicJson = await arabicResp.json();
        const englishJson = await englishResp.json();

        const stripHtml = (s) => (s || '').replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').trim();

        if (!arabicJson || !Array.isArray(arabicJson.verses) || !arabicJson.verses.length) {
          throw new Error('Invalid response');
        }

            // This cleans the text
        const cleanArabic = (text) => {
          if (!text) return '';
          return text
            .replace(/\uFFFD/g, '') // Deletes the broken box
            .replace(/\u25A1/g, '') // Deletes the empty square
            .replace(/□/g, '')      // Deletes raw boxes
            .replace(/\u06DD/g, '') // DELETES THE GREEN SYMBOL
            .replace(/  +/g, ' ')   // Cleans up spaces
            .trim();
        };

        const data = {
          surah: num,
          verses: arabicJson.verses.map((v, i) => ({
            num: parseInt(v.verse_key.split(':')[1], 10),
            ar: cleanArabic(v.text_indopak || ''), // <--- APPLIED HERE
            en: stripHtml(englishJson?.translations?.[i]?.text || '')
          })),
          __cachedAt: Date.now()
        };
        _quranDataCache[num] = data;
        try { localStorage.setItem(cacheKey, JSON.stringify(data)); } catch (e) { }
        return data;
      } catch (e) {
        console.warn('Prefetch failed for surah', num, e);
        return null;
      }
    }

    async function fetchAndRenderQuran(num) {
      try {
        let data = _quranDataCache[num] || null;

        if (!data) {
          const cacheKey = 'quran-surah-indopak-v2-' + num;
          try {
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
              const parsed = JSON.parse(cached);
              if (Date.now() - (parsed.__cachedAt || 0) < 30 * 24 * 3600 * 1000) { data = parsed; }
            }
          } catch (e) { }
        }

        if (!data) {
          const [arabicResp, englishResp] = await Promise.all([
                fetch('https://api.quran.com/api/v4/quran/verses/indopak?chapter_number=' + num),
            fetch('https://api.quran.com/api/v4/quran/translations/20?chapter_number=' + num)
          ]);
          if (!arabicResp.ok || !englishResp.ok) throw new Error('API error');
          const arabicJson = await arabicResp.json();
          const englishJson = await englishResp.json();

          const stripHtml = (s) => (s || '').replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').trim();

                if (!arabicJson || !Array.isArray(arabicJson.verses) || !arabicJson.verses.length) {
            throw new Error('Invalid response');
          }

          const cleanArabic = (text) => {
            if (!text) return '';
            return text
              .replace(/\uFFFD/g, '') 
              .replace(/\u25A1/g, '') 
              .replace(/□/g, '')      
              .replace(/\u06DD/g, '') // DELETES THE GREEN SYMBOL
              .replace(/  +/g, ' ')   
              .trim();
          };

          data = {
            surah: num,
            verses: arabicJson.verses.map((v, i) => ({
              num: parseInt(v.verse_key.split(':')[1], 10),
              ar: cleanArabic(v.text_indopak || ''), // <--- APPLIED HERE
              en: stripHtml(englishJson?.translations?.[i]?.text || '')
            })),
            __cachedAt: Date.now()
          };
          try { localStorage.setItem(cacheKey, JSON.stringify(data)); } catch (e) { }
        }

        _quranDataCache[num] = data;

        const meta = SURAHS.find(x => x.num === num);
        if (S.screen !== 'quran-reader' || S.arg !== num) return;

        paintQuranSurah(num, data, meta);
      } catch (err) {
        console.error('Quran fetch error:', err);
        if (S.screen !== 'quran-reader' || S.arg !== num) return;
        const container = $('.content');
        if (!container) return;
        const s = SURAHS.find(x => x.num === num);
          container.innerHTML = `

          </div>
          <div class="card empty">
            <div style="font-weight:600;color:var(--tx);margin-bottom:8px;">Couldn\u2019t load the full text</div>
            <div style="max-width:460px;margin:0 auto;line-height:1.7;font-size:13px;">
            Please check your internet connection and try again. If the problem continues, the Qur'an API may be temporarily unavailable.
            </div>
            <button class="btn btn-primary" style="margin-top:16px;" onclick="go('quran-reader',${num})">Retry</button>
          </div>`;
        bindGlobalNav();
      }
    }

        if (grouped[item.cat]) {
          grouped[item.cat].push({ item: item, index: index });
        }
      });

        rows.push({ heading: cat });

        (grouped[cat] || []).forEach(function (entry) {
          rows.push(entry);

          if (row.heading) {

          let yearIdx = Math.floor(rem / 354.36667);
          rem -= Math.floor(yearIdx * 354.36667);

          const leapInCycle = [2, 5, 7, 10, 13, 16, 18, 21, 24, 26, 29];
          const isLeapYear = leapInCycle.includes(yearIdx + 1);

          const monthLens = [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, isLeapYear ? 30 : 29];

          let daysLeft = Math.floor(rem);
          let month = 1, day = 1;
          for (let m = 0; m < 12; m++) {
            if (daysLeft < monthLens[m]) { month = m + 1; day = daysLeft + 1; break; }

          return { day, month, year: cycles * 30 + yearIdx + 1 };

            const month = parseInt(parts.find(p => p.type === 'month')?.value || '0', 10);
            const year = parseInt(parts.find(p => p.type === 'year')?.value || '0', 10);
            if (day > 0 && month > 0 && year > 0 && month <= 12) {

           function _computeTrackerStats(range, records) {

    salah: 0, salahMax: 0, routine: 0, routineMax: 0,
    adhkar: 0, adhkarMax: 0, quranVerses: 0, quranVersesMax: 0

  const dayResults = [];

  let pctSum = 0;
  let pastDays = 0;

  for (let i = 0; i < days.length; i++) {
    const dd = days[i];
    const ds = dateStr(dd);
    const isFuture = dd > now;
    const rec = records[i] || _trackerEmptyDay();

    const routineStats = _routineStatsForDate(rec, dd);
    const routineDone = routineStats.done;
    const routineMax  = routineStats.total;

    const salahDone = Object.values(rec.salah || {}).filter(v => v === 'completed').length;
    const adhkarDone = (rec.adhkar?.morning ? 1 : 0) + (rec.adhkar?.evening ? 1 : 0);

    let quranVerses = 0;
    const quranGoal = 50;
    if (rec.quranVersesRead && typeof rec.quranVersesRead === 'object') {
      let hasAny = false;
      for (const sur of Object.keys(rec.quranVersesRead)) {
        const arr = rec.quranVersesRead[sur];
        if (Array.isArray(arr) && arr.length) { hasAny = true; break; }
      }
      quranVerses = hasAny ? quranGoal : 0;
    } else {
      quranVerses = rec.quranVerses > 0 ? quranGoal : 0;
    }
    if (!quranVerses && _trackerHasBookmarkOnDate(ds)) quranVerses = quranGoal;

    const pS = salahDone / 5;
    const pR = routineMax ? routineDone / routineMax : 0;
    const pA = adhkarDone / 2;
    const pQ = quranVerses / quranGoal;

    const dayPct = Math.min(100, Math.round(pS * 40 + pR * 30 + pA * 15 + pQ * 15));

    catTotals.salah += salahDone; catTotals.salahMax += 5;
    catTotals.routine += routineDone; catTotals.routineMax += routineMax;
    catTotals.adhkar += adhkarDone; catTotals.adhkarMax += 2;
    catTotals.quranVerses += quranVerses; catTotals.quranVersesMax += quranGoal;

    if (!isFuture) countedDays++;

    dayResults.push({ ds, dayPct, rec, dd, isFuture });

    if (isFuture) continue;
    pastDays++;
    pctSum += dayPct;

  const maxPossibleScore = totalDaysInPeriod * 100;
  const currentScore = Math.round(pctSum);
  const avgPct = maxPossibleScore > 0 ? Math.round((currentScore / maxPossibleScore) * 100) : 0;

            monday.setHours(0, 0, 0, 0);
            for (let i = 0; i < 7; i++) {
              const d = new Date(monday);
              d.setDate(monday.getDate() + i);
              days.push(d);
            }
          } else {
            const y = now.getFullYear(), m = now.getMonth();
            const daysInMonth = new Date(y, m + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
              days.push(new Date(y, m, d));
            }
          }

          let allRecords;
          try {
            const weekFetch = Promise.all(days.map(dd => {
              const ds = dateStr(dd);
              if (S.dayCache[ds]) return Promise.resolve(S.dayCache[ds]);
              return getJSON('day:' + ds);
            }));
            const weekTimeout = new Promise((resolve) =>
              setTimeout(() => resolve(null), 6000)
            );
            allRecords = await Promise.race([weekFetch, weekTimeout]);

            console.warn('Tracker week fetch failed:', e);
            allRecords = null;

        function openCropper(inputEl) {
          const file = inputEl.files && inputEl.files[0];
          inputEl.value = '';
          if (!file) return;
          if (!file.type.startsWith('image/')) { toast('Please pick an image file.'); return; }

          const overlay = $('#pfp-modal-overlay');
          if (overlay && !overlay.classList.contains('show')) {
            overlay.style.display = 'flex';
            requestAnimationFrame(() => overlay.classList.add('show'));
          }

          const imgEl = $('#pfp-crop-image');
          const cropContainer = $('#pfp-crop-container');
          const actionList = $('#pfp-action-list');

          imgEl.src = URL.createObjectURL(file);

          if (actionList) actionList.style.display = 'none';
          if (cropContainer) cropContainer.classList.add('active');

          _cropperState.zoom = 1;
          _cropperState.offsetX = 0;
          _cropperState.offsetY = 0;
          $('#pfp-zoom-slider').value = 1;

          imgEl.onload = () => {
            _cropperState.img = imgEl;
            const viewport = $('#pfp-crop-viewport').getBoundingClientRect();
            const vw = viewport.width;
            const vh = viewport.height;
            const iw = imgEl.naturalWidth;
            const ih = imgEl.naturalHeight;
            _cropperState.baseScale = Math.max(vw / iw, vh / ih);
            imgEl.style.width = iw + 'px';
            imgEl.style.height = ih + 'px';
            updateCropperTransform();
          };
        }

        function updateCropperTransform() {
          const imgEl = $('#pfp-crop-image');
          if (!imgEl || !_cropperState.img) return;

          const totalScale = _cropperState.baseScale * _cropperState.zoom;
          const viewport = $('#pfp-crop-viewport').getBoundingClientRect();
          const vw = viewport.width;
          const vh = viewport.height;
          const iw = imgEl.naturalWidth * totalScale;
          const ih = imgEl.naturalHeight * totalScale;

          const maxOffsetX = Math.max(0, (iw - vw) / 2);
          const maxOffsetY = Math.max(0, (ih - vh) / 2);

          _cropperState.offsetX = Math.max(-maxOffsetX, Math.min(maxOffsetX, _cropperState.offsetX));
          _cropperState.offsetY = Math.max(-maxOffsetY, Math.min(maxOffsetY, _cropperState.offsetY));

          imgEl.style.transform = `translate(-50%, -50%) translate(${_cropperState.offsetX}px, ${_cropperState.offsetY}px) scale(${totalScale})`;
        }

        function setupCropperEvents() {
          const viewport = $('#pfp-crop-viewport');
          const slider = $('#pfp-zoom-slider');
          const imgEl = $('#pfp-crop-image');
          if (!viewport || !slider || !imgEl) return;

          slider.oninput = (e) => {
            _cropperState.zoom = parseFloat(e.target.value);
            updateCropperTransform();
          };

          viewport.addEventListener('pointerdown', (e) => {
            if (!_cropperState.img) return;
            e.preventDefault();
            if (e.pointerType === 'touch' && e.touches && e.touches.length === 2) {
              _cropperState.isPinching = true;
              _cropperState.startPinchDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
              );
              _cropperState.startZoom = _cropperState.zoom;
            } else {
              _cropperState.isDragging = true;
              _cropperState.startX = e.clientX - _cropperState.offsetX;
              _cropperState.startY = e.clientY - _cropperState.offsetY;
              viewport.setPointerCapture(e.pointerId);
            }
          });

          viewport.addEventListener('pointermove', (e) => {
            if (!_cropperState.img) return;
            e.preventDefault();

            if (_cropperState.isPinching && e.touches && e.touches.length === 2) {
              const dist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
              );
              const scaleFactor = dist / _cropperState.startPinchDist;
              _cropperState.zoom = Math.max(1, Math.min(4, _cropperState.startZoom * scaleFactor));
              slider.value = _cropperState.zoom;
              updateCropperTransform();
            } else if (_cropperState.isDragging) {
              _cropperState.offsetX = e.clientX - _cropperState.startX;
              _cropperState.offsetY = e.clientY - _cropperState.startY;
              updateCropperTransform();
            }
          });

          const endDrag = (e) => {
            _cropperState.isDragging = false;
            _cropperState.isPinching = false;
            try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}
          };
          viewport.addEventListener('pointerup', endDrag);
          viewport.addEventListener('pointercancel', endDrag);
          viewport.addEventListener('pointerleave', endDrag);

          $('#pfp-crop-save').onclick = async () => {
            if (!_cropperState.img) return;

              }

        }

        function cropAndResize(state) {
          return new Promise((resolve, reject) => {
            const imgEl = $('#pfp-crop-image');
            if (!imgEl) return reject('No image element');

            const canvas = document.createElement('canvas');
            const size = 200;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const viewport = $('#pfp-crop-viewport').getBoundingClientRect();
            const vw = viewport.width;
            const vh = viewport.height;
            const totalScale = state.baseScale * state.zoom;
            const viewportCenterX = vw / 2;
            const viewportCenterY = vh / 2;
            const imgCenterX = viewportCenterX + state.offsetX;
            const imgCenterY = viewportCenterY + state.offsetY;
            const sx = (imgCenterX - vw / 2) / totalScale;
            const sy = (imgCenterY - vh / 2) / totalScale;
            const sWidth = vw / totalScale;
            const sHeight = vh / totalScale;

            ctx.drawImage(imgEl, sx, sy, sWidth, sHeight, 0, 0, size, size);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          });
        }

            try {
              const track = _webcamStream.getVideoTracks()[0];
              const caps = track.getCapabilities ? track.getCapabilities() : {};
              const wants = {};
              if (caps.exposureMode && caps.exposureMode.includes('continuous'))
                wants.exposureMode = 'continuous';
              if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous'))
                wants.whiteBalanceMode = 'continuous';
              if (caps.colorTemperature) wants.colorTemperature = 5200;
              if (caps.brightness) wants.brightness = 128;
              if (caps.contrast) wants.contrast = 128;
              if (caps.saturation) wants.saturation = 100;
              if (Object.keys(wants).length) {
                await track.applyConstraints({ advanced: [wants] }).catch(() => {});
              }
            } catch (_) {}

        function _normalizeQuery(q) {
          return (q || '')
            .toLowerCase()
            .replace(/[^a-z0-9\u0600-\u06FF\s'-]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
        }

        // STRICT classifier:
        //   1. Refuse anti-Islam phrases.
        //   2. Refuse anything containing a non-Islamic blocklist word.
        //   3. Allow if it contains an Islamic term from ISLAMIC_ALLOWED.
        //   4. Allow Arabic-script queries.
        //   5. Refuse everything else — including "kiss", "india", "love",
        //      "cute", "baby", random words, and unknown names.
        function _isIslamicQuery(query) {
          const q = _normalizeQuery(query);
          if (!q || q.length < 2) return false;

          // 1. Anti-Islam phrases.
          const qHyphen = q.replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
          const qNoSpace = q.replace(/\s+/g, '').replace(/-/g, '');
          for (const phrase of HARD_REFUSE_PHRASES) {
            const phr = phrase.toLowerCase();
            if (qHyphen.includes(phr)) return false;
            const phrNoSpace = phr.replace(/\s+/g, '').replace(/-/g, '');
            if (phrNoSpace && qNoSpace.includes(phrNoSpace)) return false;
          }

          // 2. Non-Islamic blocklist.
          for (const bad of NON_ISLAMIC_BLOCKLIST) {
            const escaped = bad.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp('(^|\\s)' + escaped + '(\\s|$)', 'i');
            if (re.test(q)) return false;
          }

          // 3. Islamic allow list (word-boundary).
          for (const kw of ISLAMIC_ALLOWED) {
            const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp('(^|[^a-z0-9])' + escaped + '([^a-z0-9]|$)', 'i');
            if (re.test(q)) return true;
          }

          // 4. Arabic script.
          if (/[\u0600-\u06FF]/.test(q)) return true;

          // 5. Not recognised → refuse.
          return false;
        }

        // YouTube IFrame API loader (single promise).
        let _ytApiPromise = null;
        function _loadYouTubeApi() {
          if (_ytApiPromise) return _ytApiPromise;
          _ytApiPromise = new Promise((resolve) => {
            if (window.YT && window.YT.Player) { resolve(window.YT); return; }
            const prev = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => {
              if (typeof prev === 'function') { try { prev(); } catch (e) {} }
              resolve(window.YT);
            };
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
          });
          return _ytApiPromise;
        }

                  async function openYouTubePlayer(videoId) {
          const overlay = document.getElementById('yt-player-overlay');
          if (!overlay) return;

          // Pause (don't destroy) any currently-playing Qur'an audio. The audio
          // bar stays visible & paused; the user can resume it or close it
          // themselves from the audio bar's own X button.
          try {
            if (_qAudio && !_qAudio.paused) {
              _qAudio.pause();
              _abSetPlaying(false);
              _abSyncStatus(false);
            }
            if (window.speechSynthesis && window.speechSynthesis.speaking) {
              window.speechSynthesis.pause();
            }
          } catch (e) {}

          overlay.style.display = 'flex';
          requestAnimationFrame(() => overlay.classList.add('show'));

          await _loadYouTubeApi();

          if (_ytPlayer) {
            try { _ytPlayer.loadVideoById(videoId); } catch (e) {}
            return;
          }

          _ytPlayer = new window.YT.Player(_ytPlayerElId, {
            videoId: videoId,
            playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
            events: {
              onReady: (e) => { try { e.target.playVideo(); } catch (err) {} }
            }
          });
        }

        function closeYouTubePlayer() {
          const overlay = document.getElementById('yt-player-overlay');
          if (overlay) {
            overlay.classList.remove('show');
            setTimeout(() => { overlay.style.display = 'none'; }, 200);
          }
          if (_ytPlayer) {
            try {
              if (typeof _ytPlayer.destroy === 'function') _ytPlayer.destroy();
            } catch (e) {}
            _ytPlayer = null;
          }
        }

          const handler = (e) => {
            if (e.matches) {
              try { closeYouTubePlayer(); } catch (_) {}
            }
          };
          if (mq.addEventListener) mq.addEventListener('change', handler);
          else if (mq.addListener) mq.addListener(handler);

        function installSettingsFreeze() {

            const wasFrozen = _settingsFrozen;

              + privacyCardH
              + 200;

            const viewportH = window.innerHeight;
            const availableBelowPin = viewportH - PIN_TOP - BOTTOM_RESERVED;

            const shortfall = Math.max(0, neededBelowPin - availableBelowPin);

            const scrollAtPin = content.scrollTop + (bdayHeaderTop - PIN_TOP);
            _settingsFreezePoint = Math.max(0, scrollAtPin - shortfall);

            if (wasFrozen) content.classList.add('settings-frozen');
          };

            computeFreezePoint();

            content.classList.add('settings-frozen');

              + (ARABIC_TOP - PIN_TOP)
              + arabicCardH
              + (PRIVACY_TOP - ARABIC_TOP)
              + privacyCardH
              + 200;

            const availableBelowPin = window.innerHeight - PIN_TOP - BOTTOM_RESERVED;
            const shortfall = Math.max(0, neededBelowPin - availableBelowPin);

            const distanceFromPin = bdayHeaderTop - PIN_TOP;

            if (distanceFromPin <= shortfall) {
              lock();
            }
          };

          {
            const bdayHeaderTop = birthdayHeader.getBoundingClientRect().top;
            const bdayCardH     = birthdayCard.getBoundingClientRect().height;
            const arabicCardH   = sections[3].querySelector('.card').getBoundingClientRect().height;
            const privacyCardH  = privacyCard.getBoundingClientRect().height;

            const neededBelowPin =

              + (PRIVACY_TOP - ARABIC_TOP)
              + privacyCardH
              + 200;

            const availableBelowPin = window.innerHeight - PIN_TOP - BOTTOM_RESERVED;
            const shortfall = Math.max(0, neededBelowPin - availableBelowPin);

            if (bdayHeaderTop - PIN_TOP <= shortfall) {

            if (currentTheme !== savedTheme) {

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const rawData = atob(base64);

    async function setupPushNotifications() {
      try {
        // Check browser support
        if (!("Notification" in window)) {
          console.warn("Notifications are not supported.");
          return false;
        }

        if (!("serviceWorker" in navigator)) {
          console.warn("Service Workers are not supported.");
          return false;
        }

        if (!("PushManager" in window)) {
          console.warn("Push notifications are not supported.");
          return false;
        }

        // Ask for notification permission
        let permission = Notification.permission;

        if (permission !== "granted") {
          permission = await Notification.requestPermission();
        }

        if (permission !== "granted") {
          console.warn("Notification permission was not granted.");
          return false;
        }

          // Register the SINGLE service worker (push handlers are imported inside it)
        const registration = await navigator.serviceWorker.register('/service-worker.js');

        console.log("Push service worker registered:", registration);

        // Wait until service worker is ready
        const readyRegistration =
          await navigator.serviceWorker.ready;

        // Check if subscription already exists
        let subscription =
          await readyRegistration.pushManager.getSubscription();

        // Create subscription if needed
        if (!subscription) {
          subscription =
            await readyRegistration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey:
                urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
            });
        }

        console.log("Push subscription created:", subscription);

        // Get current Supabase user

          data: { user },
          error: userError

          return false;

          return false;
        }

        // Save subscription to Supabase

          await window.sb.supabase
            .from("push_subscriptions")
            .upsert(

                subscription: subscription.toJSON(),

                onConflict: "endpoint"

            );

          return false;

          "✅ Push subscription saved to Supabase."

      const getScrollTop = () => {

        if (c && c.scrollHeight > c.clientHeight + 10 &&

        if (getScrollTop() > 300) {

        e.preventDefault();

        const c = document.querySelector('.content');
        // If .content is the scroller, scroll it. Otherwise scroll the window.
        if (c && c.scrollHeight > c.clientHeight + 10 &&
            (c.scrollTop > 0 || getComputedStyle(c).overflowY === 'auto' || getComputedStyle(c).overflowY === 'scroll')) {
          c.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      // Listen on BOTH window and .content so it works everywhere.
      window.addEventListener('scroll', updateVisibility, { passive: true });

      document.addEventListener('scroll', (e) => {
        if (e.target === document || (e.target.classList && e.target.classList.contains('content'))) {

        setTimeout(updateVisibility, 60);

        audio.onended = null;

        try {
          audio.pause();
          audio.currentTime = 0;

          audio.load();
        } catch (e) {
          console.warn('Could not fully reset Adhan audio:', e);
        }
      }

      if (window._activeAdhanKey) {
        window._activeAdhanKey = null;

        if (S && S.screen === 'settings') {
          render();
        }
      }

      const banner = document.getElementById('in-app-banner');
      if (banner) {

    function _playNotificationAdhan(prayer) {
      if (!S || !S.settings || !S.settings.notif || !S.settings.notif[prayer]) return;

      // Audio and in-app banners only work when the page is visible.
      if (document.visibilityState !== 'visible') return;

      _stopNotificationAdhan();

      const prayerName = prayer.charAt(0).toUpperCase() + prayer.slice(1);
      const adhanUrl = 'https://media.assabile.com/assabile/adhan_3435370/166d1f7c435a.mp3';

      _notificationAdhanAudio = new Audio(adhanUrl);
      _notificationAdhanAudio.onended = () => {
        _stopNotificationAdhan();
      };

      _notificationAdhanAudio.play().catch(err => {
        console.warn('Adhan playback blocked by browser:', err);
      });

      const oldBanner = document.getElementById('in-app-banner');
      if (oldBanner) oldBanner.remove();

      const banner = document.createElement('div');
      banner.id = 'in-app-banner';
      banner.style.cssText = `
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--green);
        color: #fff;
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        z-index: 99999;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-width: 250px;
        max-width: 90%;
      `;

      banner.innerHTML = `
        <div>
          <div style="font-weight:700;font-size:14px;">
            ${prayerName} Prayer Time
          </div>
          <div style="font-size:12px;opacity:0.9;margin-top:2px;">
            Azaan is playing...
          </div>
        </div>
        <button
          id="close-adhan-btn"
          aria-label="Stop Adhan"
          style="background:rgba(255,255,255,0.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;"
        >
          ✕
        </button>
      `;

      document.body.appendChild(banner);

      const closeBtn = banner.querySelector('#close-adhan-btn');
      if (closeBtn) {
        closeBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          _stopNotificationAdhan();
        };
      }
    }


    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (!event.data) return;

        if (event.data.type === 'PLAY_ADHAN') {
          _playNotificationAdhan((event.data.prayer || 'fajr').toLowerCase());
        }
        if (event.data.type === 'STOP_ADHAN') {
          _stopNotificationAdhan();
        }
        if (event.data.type === 'SHOW_PRAYER_MODAL') {
          let prayerName = event.data.prayer || '';
          if (!prayerName && event.data.title) {
            prayerName = String(event.data.title)
              .replace(/^[^\w]*\s*/, '')
              .replace(/\s*Check\s*$/i, '')
              .trim();
          }
          if (prayerName) {
            openPrayerModal(prayerName, event.data.tag || null);
          }
        }
        if (event.data.type === 'SHOW_BANNER') {
          const title = event.data.title || '';
          const old = document.getElementById('in-app-banner');
          if (old) old.remove();
          const banner = document.createElement('div');
          banner.id = 'in-app-banner';
          banner.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:16px 24px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:99999;font-family:inherit;max-width:90%;text-align:center;transition:all 0.3s ease;cursor:pointer;';
          banner.innerHTML =
            `<div style="font-weight:700;font-size:15px;margin-bottom:4px;">${title || 'Deen Sphere'}</div>` +
            `<div style="font-size:13px;opacity:0.9;">${event.data.body || ''}</div>`;
          banner.onclick = () => { banner.remove(); go('home'); };
          document.body.appendChild(banner);
          setTimeout(() => {
            banner.style.opacity = '0';
            banner.style.top = '-100px';
            setTimeout(() => banner.remove(), 300);
          }, 5000);
        }
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        _stopNotificationAdhan();
        if (typeof window._stopAdhanPreview === 'function') window._stopAdhanPreview();
      }
    });
    window.addEventListener('blur', () => {
      _stopNotificationAdhan();
    });


    /* ============================= COLD-START POPUP ============================= */

    window.addEventListener('load', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const fromUrl = urlParams.get('openPrayerModal') === 'true';
      const fromSession = sessionStorage.getItem('__openPrayerModal') === 'true';

      window.__openingPrayerFromNotification = fromUrl || fromSession;

      // ============================================================
      // Path B: user tapped a CHECK notification.
      // A check notification always carries a prayer param, so guard on it:
      // a plain refresh / normal notification tap never has one, and must
      // not open a popup.
      // ============================================================
      const kindParam = urlParams.get('kind') || '';
      const hasPrayerParam =
        kindParam === 'check' ||
        (
          !kindParam &&
          !!(
            urlParams.get('prayer') ||
            sessionStorage.getItem('__prayerName')
          )
        );

      if ((fromUrl || fromSession) && hasPrayerParam) {
        const prayer =
          urlParams.get('prayer') ||
          sessionStorage.getItem('__prayerName') ||
          'fajr';
        const tag =
          urlParams.get('tag') ||
          sessionStorage.getItem('__prayerTag') ||
          null;

        try {
          sessionStorage.removeItem('__openPrayerModal');
          sessionStorage.removeItem('__prayerName');
          sessionStorage.removeItem('__prayerTag');
          window.history.replaceState({}, document.title, window.location.pathname);
        } catch (e) {}

        // AWAIT the clear so consumePendingChecks can't re-read the same record.
        try { await clearPendingDBApp(); } catch (e) {}

        let triesB = 0;
        const ivB = setInterval(() => {
          triesB++;
          const ready =
            S && S.profile && S.settings && S.settings.setupDone &&
            S.screen !== 'splash' && S.screen !== 'auth';
          if (ready) {
            clearInterval(ivB);
            openPrayerModal(prayer, tag);
          } else if (triesB > 80) {
            clearInterval(ivB);
            openPrayerModal(prayer, tag);
          }
        }, 250);
        return;
      }

      // ============================================================
      // Path C: user opened the app from the home-screen icon.
      // No URL params. We must read the pending check from IndexedDB
      // ourselves and show the popup — independent of network state.
      // ============================================================
      let triesC = 0;
      const ivC = setInterval(() => {
        triesC++;
        const ready =
          S && S.profile && S.settings && S.settings.setupDone &&
          S.screen !== 'splash' && S.screen !== 'auth' && !_openPrayerKey;
        if (ready) {
          clearInterval(ivC);
          consumePendingChecks();
        } else if (triesC > 80) {
          clearInterval(ivC);
          consumePendingChecks();
        }
      }, 250);
    });


    /* ============================= PENDING CHECK PRAYERS ============================= */

    const PENDING_DB_NAME_APP = 'deen-sphere-pending';
    const PENDING_STORE_APP = 'pending-prayers';

    function openPendingDBApp() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(PENDING_DB_NAME_APP, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(PENDING_STORE_APP)) {
            db.createObjectStore(PENDING_STORE_APP, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function clearPendingDBApp() {
      return new Promise((resolve) => {
        const req = indexedDB.open('deen-sphere-pending', 1);
        req.onsuccess = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('pending-prayers')) {
            db.close();
            return resolve();
          }
          const tx = db.transaction('pending-prayers', 'readwrite');
          tx.objectStore('pending-prayers').clear();
          tx.oncomplete = () => { db.close(); resolve(); };
          tx.onerror = () => { db.close(); resolve(); };
        };
        req.onerror = () => resolve();
      });
    }

    async function consumePendingChecks() {
      if (window.__openingPrayerFromNotification) return;

      if (!S || !S.profile || !S.settings || !S.settings.setupDone) return;
      if (S.screen === 'splash' || S.screen === 'auth') return;
      if (_openPrayerKey) return;

      try {
        const db = await openPendingDBApp();

        // Recheck after the asynchronous database connection.
        if (window.__openingPrayerFromNotification || _openPrayerKey) {
          db.close();
          return;
        }

        const tx = db.transaction(PENDING_STORE_APP, 'readwrite');
        const store = tx.objectStore(PENDING_STORE_APP);

        const items = await new Promise((resolve, reject) => {
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });

        if (window.__openingPrayerFromNotification || _openPrayerKey) {
          db.close();
          return;
        }

        if (!items.length) {
          db.close();
          return;
        }

        items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        const latest = items[0];

        store.clear();

        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
        });

        db.close();

        // Ignore stale pending notifications older than three hours.
        if (Date.now() - (latest.createdAt || 0) > 3 * 60 * 60 * 1000) return;

        if (window.__openingPrayerFromNotification || _openPrayerKey) return;

        openPrayerModal(latest.prayer, latest.tag || null);
      } catch (e) {
        console.warn('consumePendingChecks failed:', e);
      }
    }

   /* ============================= PRAYER MODAL ============================= */

// POP-UP GUARD: only once per prayer per day.
// This is what stops the "5 times" duplicate pop-up.
function _promptedKey(prayerKey) {
  return 'prayerPrompted:' + dateStr(new Date()) + ':' + prayerKey;
}
function _alreadyPrompted(prayerKey) {
  try { return localStorage.getItem(_promptedKey(prayerKey)) === '1'; } catch (e) { return false; }
}
function _markPrompted(prayerKey) {
  try { localStorage.setItem(_promptedKey(prayerKey), '1'); } catch (e) {}
}

function _dismissNotifTag(notifTag) {
  if (!notifTag) return;
  try {
    navigator.serviceWorker.ready.then(function (reg) {
      reg.getNotifications({ tag: notifTag }).then(function (notifs) {
        notifs.forEach(function (n) { try { n.close(); } catch (e) {} });
      }).catch(function () {});
    }).catch(function () {});
  } catch (e) {}
}

function openPrayerModal(prayerName, notifTag) {
  const modal = document.getElementById('prayer-log-modal');
  if (!modal) return;
  if (_openPrayerKey) return;

  const PRAYER_KEY = {
    fajr: 'fajr', dhuhr: 'dhuhr', asr: 'asr',
    maghrib: 'maghrib', isha: 'isha'
  };
  const PRAYER_LABEL = {
    fajr: 'Fajr', dhuhr: 'Dhuhr', asr: 'Asr',
    maghrib: 'Maghrib', isha: 'Isha'
  };

  const raw = String(prayerName || '').trim();
  const lower = raw.toLowerCase().replace(/[^a-z]/g, '');
  const key = PRAYER_KEY[lower];
  if (!key) {
    console.warn('openPrayerModal: unknown prayer', prayerName);
    return;
  }

  // 🔒 Pop-up can only ever appear once per prayer per day.
  if (_alreadyPrompted(key)) {
    _dismissNotifTag(notifTag);
    return;
  }

  _openPrayerKey = key;
  _markPrompted(key);

  const dismissNotification = () => {
    if (!notifTag) return;
    try {
      navigator.serviceWorker.ready.then(function (reg) {
        reg.getNotifications({ tag: notifTag }).then(function (notifs) {
          notifs.forEach(function (n) { try { n.close(); } catch (e) {} });
        }).catch(function () {});
      }).catch(function () {});
    } catch (e) {}
  };

  try {
    const titleEl = document.getElementById('prayer-modal-title');
    const subEl = document.getElementById('prayer-modal-sub');
    if (!titleEl || !subEl) {
      _openPrayerKey = null;
      return;
    }
    titleEl.textContent = PRAYER_LABEL[key];
    subEl.textContent = 'Did you offer ' + PRAYER_LABEL[key] + ' prayer?';
    modal.style.display = 'flex';

    _stopNotificationAdhan();

    document.querySelectorAll('.prayer-modal-btn').forEach(btn => {
      btn.onclick = async () => {
        const action = btn.dataset.action;
        const ds = dateStr(new Date());
        try {
          const day = await getDay(ds);
          if (!day.salah) day.salah = {};

          if (action === 'jamaah' || action === 'alone' || action === 'qaza') {
            day.salah[key] = 'completed';
          } else if (action === 'missed') {
            day.salah[key] = 'pending';
          } else if (action === 'unknown') {
            delete day.salah[key];
          } else {
            modal.style.display = 'none';
            _openPrayerKey = null;
            dismissNotification();
            return;
          }

          await saveDay(ds, day);

          if (S.screen === 'home') {
            repaintHomeFromCache(ds);
          } else {
            go('home');
          }
        } catch (err) {
          console.warn('Failed to log prayer from modal:', err);
        }
        modal.style.display = 'none';
        _openPrayerKey = null;
        dismissNotification();
      };
    });

    const cancelBtn = document.getElementById('prayer-modal-cancel');
    if (cancelBtn) {
      cancelBtn.onclick = () => {
        modal.style.display = 'none';
        _openPrayerKey = null;
        dismissNotification();
      };
    }

    modal.onclick = (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
        _openPrayerKey = null;
        dismissNotification();
      }
    };
  } catch (err) {
    console.warn('openPrayerModal setup failed:', err);
    _openPrayerKey = null;
  }
}

          function triggerPendingAuthPopup() {
  try {
    const pendingPrayer = sessionStorage.getItem('__pendingAuthPopup');
    if (pendingPrayer) {
      sessionStorage.removeItem('__pendingAuthPopup'); // Clear so it only shows once
      
      // Wait 1.5 seconds to make sure the UI has loaded
      setTimeout(() => {
        openPrayerModal(pendingPrayer, null); 
      }, 1500);
    }
  } catch(e) {}
}
